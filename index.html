/* =========================
   LOAD GAME TABLES
========================= */

async function loadGameTables() {

    const { data, error } =
        await db
            .from("game_tables")
            .select(`
                *,
                table_players (*)
            `)
            .order(
                "table_number",
                { ascending: false }
            );

    if (error) {
        console.error(
            "Load game tables error:",
            error
        );

        alert("שגיאה בטעינת שולחנות המשחק");
        return;
    }

    gameTables = data || [];

    renderGameTables();
}


/* =========================
   RENDER GAME TABLES
========================= */

function renderGameTables() {

    gameTablesList.innerHTML = "";

    gameTables.forEach(function(table) {

        const tableElement =
            document.createElement("div");

        tableElement.className = "customer";

        tableElement.innerHTML = `
            <div class="customer-header">
                <div>
                    <div class="customer-name">
                        🎱 שולחן ${table.table_number}
                    </div>

                    <div class="status">
                        עד 4 שחקנים
                    </div>
                </div>

                <div>
                    ${Number(table.hourly_price).toFixed(0)} ₪ / שעה
                </div>
            </div>
        `;

        gameTablesList.appendChild(
            tableElement
        );
    });
}

/* =========================
   LOGIN
========================= */

async function login() {

    const password =
        adminPassword.value;

    if (!password) {

        loginError.textContent =
            "נא להזין סיסמה";

        loginError.style.display =
            "block";

        return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
        "מתחבר...";

    loginError.style.display =
        "none";


    const { error } =
        await db.auth.signInWithPassword({

            email: ADMIN_EMAIL,

            password: password

        });


    if (error) {

        loginError.textContent =
            "הסיסמה שגויה";

        loginError.style.display =
            "block";

        loginBtn.disabled = false;

        loginBtn.textContent =
            "כניסה";

        return;
    }


    loginScreen.style.display =
        "none";

    app.style.display =
        "block";


    await loadCustomersFromSupabase();
    await loadGameTables();

    loginBtn.disabled = false;

    loginBtn.textContent =
        "כניסה";
}


loginBtn.addEventListener(
    "click",
    login
);


adminPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);


async function checkLogin() {

    const { data } =
        await db.auth.getSession();


    if (data.session) {

        loginScreen.style.display =
            "none";

        app.style.display =
            "block";


        await loadCustomersFromSupabase();

    } else {

        loginScreen.style.display =
            "flex";

        app.style.display =
            "none";

    }
}


checkLogin();


/* =========================
   TIME
========================= */

function formatTime(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours).padStart(2, "0")
        + ":" +

        String(minutes).padStart(2, "0")
        + ":" +

        String(seconds).padStart(2, "0")

    );
}


function getElapsedSeconds(customer) {

    let seconds =
        Number(
            customer.elapsedSeconds
        ) || 0;


    if (
        customer.running &&
        customer.startedAt
    ) {

        seconds +=
            Math.floor(
                (
                    Date.now() -
                    customer.startedAt
                ) / 1000
            );

    }


    return Math.max(
        0,
        seconds
    );
}


function getGameCost(customer) {

    return (

        getElapsedSeconds(customer)
        / 3600

    ) * Number(
        customer.hourlyPrice || 0
    );
}


function getOrdersCost(customer) {

    return customer.orders.reduce(

        function(total, order) {

            return (
                total +
                Number(order.price || 0)
            );

        },

        0
    );
}


/* =========================
   LOAD FROM DATABASE
========================= */

async function loadCustomersFromSupabase() {

    const { data, error } =
        await db

            .from("active_sessions")

            .select(`
                *,
                orders (*)
            `)

            .order(
                "created_at",
                { ascending: true }
            );


    if (error) {

        console.error(
            "Load customers error:",
            error
        );

        alert(
            "שגיאה בטעינת הנתונים מהשרת"
        );

        return;
    }


    customers =
        (data || []).map(

            function(row) {

                return {

                    id: row.id,

                    name:
                        row.customer_name,

                    hourlyPrice:
                        Number(
                            row.hourly_price ??
                            DEFAULT_HOURLY_PRICE
                        ),

                    elapsedSeconds:
                        Number(
                            row.elapsed_seconds ??
                            0
                        ),

                    running:
                        Boolean(
                            row.running
                        ),

                    startedAt:
                        row.started_at
                            ? new Date(
                                row.started_at
                            ).getTime()
                            : null,

                    orders:
                        (row.orders || []).map(

                            function(order) {

                                return {

                                    id:
                                        order.id,

                                    name:
                                        order.product_name,

                                    price:
                                        Number(
                                            order.price || 0
                                        )

                                };

                            }
                        ),

                    open: false

                };

            }
        );


    renderCustomers();
}


/* =========================
   SAVE ACTIVE SESSION
========================= */

async function saveCustomer(customer) {

    const { error } =
        await db

            .from("active_sessions")

            .update({

                customer_name:
                    customer.name,

                hourly_price:
                    Number(
                        customer.hourlyPrice || 0
                    ),

                elapsed_seconds:
                    Number(
                        customer.elapsedSeconds || 0
                    ),

                running:
                    Boolean(
                        customer.running
                    ),

                started_at:
                    customer.startedAt
                        ? new Date(
                            customer.startedAt
                        ).toISOString()
                        : null,

                updated_at:
                    new Date().toISOString()

            })

            .eq(
                "id",
                customer.id
            );


    if (error) {

        console.error(
            "Save customer error:",
            error
        );

        alert(
            "שגיאה בשמירת הנתונים"
        );

        return false;
    }


    return true;
}


/* =========================
   ADD CUSTOMER
========================= */

async function addCustomer() {

    const name =
        customerNameInput
            .value
            .trim();


    if (!name) {

        alert(
            "יש להזין שם לקוח"
        );

        return;
    }


    addCustomerBtn.disabled =
        true;


    const { data, error } =
        await db

            .from("active_sessions")

            .insert({

                customer_name:
                    name,

                hourly_price:
                    DEFAULT_HOURLY_PRICE,

                elapsed_seconds:
                    0,

                running:
                    false,

                started_at:
                    null,

                updated_at:
                    new Date().toISOString()

            })

            .select()

            .single();


    addCustomerBtn.disabled =
        false;


    if (error) {

        console.error(
            "Add customer error:",
            error
        );

        alert(
            "שגיאה בהוספת הלקוח"
        );

        return;
    }


    customers.push({

        id:
            data.id,

        name:
            data.customer_name,

        hourlyPrice:
            Number(
                data.hourly_price ??
                DEFAULT_HOURLY_PRICE
            ),

        elapsedSeconds:
            Number(
                data.elapsed_seconds ??
                0
            ),

        running:
            Boolean(
                data.running
            ),

        startedAt:
            data.started_at
                ? new Date(
                    data.started_at
                ).getTime()
                : null,

        orders: [],

        open: false

    });


    customerNameInput.value =
        "";


    renderCustomers();


    customerNameInput.focus();
}

                                "button"
                            );


                        removeButton.className =
                            "remove-order";


                        removeButton.textContent =
                            "מחק";


                        removeButton
                            .addEventListener(

                                "click",

                                async function() {

                                    removeButton.disabled =
                                        true;


                                    const { error } =
                                        await db

                                            .from(
                                                "orders"
                                            )

                                            .delete()

                                            .eq(
                                                "id",
                                                order.id
                                            );


                                    if (error) {

                                        console.error(
                                            "Delete order error:",
                                            error
                                        );


                                        alert(
                                            "שגיאה במחיקת ההזמנה"
                                        );


                                        removeButton.disabled =
                                            false;


                                        return;
                                    }


                                    customer.orders =
                                        customer.orders.filter(

                                            function(item) {

                                                return (
                                                    item.id !==
                                                    order.id
                                                );

                                            }
                                        );


                                    renderOrders();

                                    updateDisplay();

                                }
                            );


                        item.appendChild(
                            text
                        );


                        item.appendChild(
                            removeButton
                        );


                        ordersList.appendChild(
                            item
                        );

                    }
                );

            }


            /* =========================
               OPEN / CLOSE CARD
            ========================= */

            header.addEventListener(

                "click",

                function() {

                    customer.open =
                        !customer.open;


                    renderCustomers();

                }
            );


            /* =========================
               START TIMER
            ========================= */

            startButton.addEventListener(

                "click",

                async function() {

                    if (
                        customer.running
                    ) {

                        return;

                    }


                    customer.running =
                        true;


                    customer.startedAt =
                        Date.now();


                    updateDisplay();


                    const ok =
                        await saveCustomer(
                            customer
                        );


                    if (!ok) {

                        customer.running =
                            false;


                        customer.startedAt =
                            null;


                        updateDisplay();

                    }

                }
            );


            /* =========================
               STOP TIMER
            ========================= */

            stopButton.addEventListener(

                "click",

                async function() {

                    if (
                        !customer.running
                    ) {

                        return;

                    }


                    const oldElapsed =
                        customer.elapsedSeconds;


                    const oldStartedAt =
                        customer.startedAt;


                    const extraSeconds =
                        Math.floor(

                            (
                                Date.now() -
                                customer.startedAt
                            ) / 1000

                        );


                    customer.elapsedSeconds +=
                        extraSeconds;


                    customer.running =
                        false;


                    customer.startedAt =
                        null;


                    updateDisplay();


                    const ok =
                        await saveCustomer(
                            customer
                        );


                    if (!ok) {

                        customer.elapsedSeconds =
                            oldElapsed;


                        customer.running =
                            true;


                        customer.startedAt =
                            oldStartedAt;


                        updateDisplay();

                    }

                }
            );

            /* =========================
                  RESET TIMER
           ========================= */

resetTimeButton.addEventListener(
    "click",
    async function() {

        const confirmed =
            confirm(
                "האם אתה בטוח שברצונך לאפס את הזמן של " +
                customer.name +
                "?"
            );

        if (!confirmed) {
            return;
        }

        const oldElapsed =
            customer.elapsedSeconds;

        const oldRunning =
            customer.running;

        const oldStartedAt =
            customer.startedAt;


        customer.elapsedSeconds = 0;
        customer.running = false;
        customer.startedAt = null;

        updateDisplay();


        const ok =
            await saveCustomer(customer);


        if (!ok) {

            customer.elapsedSeconds =
                oldElapsed;

            customer.running =
                oldRunning;

            customer.startedAt =
                oldStartedAt;

            updateDisplay();

            return;
        }

        alert("✅ הזמן אופס");
    }
);

            /* =========================
               HOURLY PRICE
            ========================= */

            hourlyPriceInput
                .addEventListener(

                    "change",

                    async function() {

                        const newPrice =
                            Number(
                                hourlyPriceInput.value
                            );


                        if (
                            !Number.isFinite(
                                newPrice
                            ) ||
                            newPrice < 0
                        ) {

                            hourlyPriceInput.value =
                                customer.hourlyPrice;


                            return;
                        }


                        const oldPrice =
                            customer.hourlyPrice;


                        customer.hourlyPrice =
                            newPrice;


                        updateDisplay();


                        const ok =
                            await saveCustomer(
                                customer
                            );


                        if (!ok) {

                            customer.hourlyPrice =
                                oldPrice;


                            hourlyPriceInput.value =
                                oldPrice;


                            updateDisplay();

                        }

                    }
                );


            /* =========================
               ADD ORDER
            ========================= */

            async function addOrder() {

                const orderName =
                    orderNameInput
                        .value
                        .trim();


                const orderPrice =
                    Number(
                        orderPriceInput.value
                    );


                if (!orderName) {

                    alert(
                        "יש להזין שם מוצר"
                    );

                    return;
                }


                if (
                    !Number.isFinite(
                        orderPrice
                    ) ||
                    orderPrice < 0
                ) {

                    alert(
                        "יש להזין מחיר תקין"
                    );

                    return;
                }


                addOrderButton.disabled =
                    true;


                const { data, error } =
                    await db

                        .from("orders")

                        .insert({

                            session_id:
                                customer.id,

                            product_name:
                                orderName,

                            price:
                                orderPrice

                        })

                        .select()

                        .single();


                addOrderButton.disabled =
                    false;


                if (error) {

                    console.error(
                        "Add order error:",
                        error
                    );


                    alert(
                        "שגיאה בהוספת ההזמנה"
                    );


                    return;
                }


                customer.orders.push({

                    id:
                        data.id,

                    name:
                        data.product_name,

                    price:
                        Number(
                            data.price
                        )

                });


                orderNameInput.value =
                    "";


                orderPriceInput.value =
                    "";


                renderOrders();

                updateDisplay();


                orderNameInput.focus();

            }


            addOrderButton
                .addEventListener(
                    "click",
                    addOrder
                );


            orderPriceInput
                .addEventListener(

                    "keydown",

                    function(event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            addOrder();

                        }

                    }
                );


            /* =========================
               CHECKOUT
            ========================= */

            checkoutButton
                .addEventListener(

                    "click",

                    async function() {

                        const elapsedSeconds =
                            getElapsedSeconds(
                                customer
                            );


                        const gameCost =
                            getGameCost(
                                customer
                            );


                        const ordersCost =
                            getOrdersCost(
                                customer
                            );


                        const finalTotal =
                            gameCost +
                            ordersCost;


                        const confirmed =
                            confirm(

                                "לסגור את החשבון של " +
                                customer.name +
                                "?\n\n" +

                                "זמן משחק: " +
                                gameCost.toFixed(2) +
                                " ₪\n" +

                                "הזמנות: " +
                                ordersCost.toFixed(2) +
                                " ₪\n\n" +

                                'סה"כ: ' +
                                finalTotal.toFixed(2) +
                                " ₪"

                            );


                        if (!confirmed) {

                            return;

                        }


                        checkoutButton.disabled =
                            true;


                        checkoutButton.textContent =
                            "שומר...";


                        const {
                            error: saleError
                        } =
                            await db

                                .from("sales")

                                .insert({

                                    customer_name:
                                        customer.name,

                                    hourly_price:
                                        Number(
                                            customer.hourlyPrice || 0
                                        ),

                                    elapsed_seconds:
                                        elapsedSeconds,

                                    game_cost:
                                        Number(
                                            gameCost.toFixed(2)
                                        ),

                                    orders_cost:
                                        Number(
                                            ordersCost.toFixed(2)
                                        ),

                                    total_amount:
                                        Number(
                                            finalTotal.toFixed(2)
                                        ),

                                    closed_at:
                                        new Date()
                                            .toISOString()

                                });


                        if (saleError) {

                            console.error(
                                "Save sale error:",
                                saleError
                            );


                            alert(
                                "שגיאה בשמירת החשבון. הלקוח לא נמחק."
                            );


                            checkoutButton.disabled =
                                false;


                            checkoutButton.textContent =
                                "✓ סגור חשבון";


                            return;
                        }


                        const {
                            error: deleteError
                        } =
                            await db

                                .from(
                                    "active_sessions"
                                )

                                .delete()

                                .eq(
                                    "id",
                                    customer.id
                                );


                        if (deleteError) {

                            console.error(
                                "Delete session error:",
                                deleteError
                            );


                            alert(
                                "החשבון נשמר, אבל הייתה שגיאה בהסרת הלקוח הפעיל."
                            );


                            checkoutButton.disabled =
                                false;


                            checkoutButton.textContent =
                                "✓ סגור חשבון";


                            return;
                        }


                        customers =
                            customers.filter(

                                function(item) {

                                    return (
                                        item.id !==
                                        customer.id
                                    );

                                }
                            );


                        renderCustomers();

                    }
                );


            renderOrders();

            updateDisplay();


            customersList.appendChild(
                customerElement
            );

        }
    );

}

/* =========================
   LIVE TIMER REFRESH
========================= */

setInterval(

    function() {

        const customerElements =
            customersList
                .querySelectorAll(
                    ".customer"
                );


        customerElements.forEach(

            function(
                element,
                index
            ) {

                const customer =
                    customers[index];


                if (
                    !customer ||
                    !customer.running
                ) {

                    return;

                }


                const timer =
                    element.querySelector(
                        ".timer"
                    );


                const gameCostElement =
                    element.querySelector(
                        ".game-cost"
                    );


                const summaryGame =
                    element.querySelector(
                        ".summary-game"
                    );


                const summaryOrders =
                    element.querySelector(
                        ".summary-orders"
                    );


                const summaryTotal =
                    element.querySelector(
                        ".summary-total"
                    );


                const seconds =
                    getElapsedSeconds(
                        customer
                    );


                const gameCost =
                    getGameCost(
                        customer
                    );


                const ordersCost =
                    getOrdersCost(
                        customer
                    );


                const total =
                    gameCost +
                    ordersCost;


                timer.textContent =
                    formatTime(
                        seconds
                    );


                gameCostElement.textContent =
                    "עלות משחק: " +
                    gameCost.toFixed(2) +
                    " ₪";


                summaryGame.textContent =
                    gameCost.toFixed(2) +
                    " ₪";


                summaryOrders.textContent =
                    ordersCost.toFixed(2) +
                    " ₪";


                summaryTotal.textContent =
                    total.toFixed(2) +
                    " ₪";

            }
        );

    },

    1000
);
    /* =========================
   SALES HISTORY
========================= */

const salesHistoryBtn =
    document.getElementById("salesHistoryBtn");

const salesHistory =
    document.getElementById("salesHistory");


salesHistoryBtn.addEventListener(
    "click",
    loadSalesHistory
);


async function loadSalesHistory() {

    // אם ההיסטוריה כבר פתוחה - סגור אותה
    if (salesHistory.style.display === "block") {

        salesHistory.style.display = "none";

        salesHistoryBtn.textContent =
            "📊 היסטוריית מכירות";

        return;
    }


    salesHistoryBtn.disabled = true;

    salesHistoryBtn.textContent =
        "טוען...";


    const { data, error } =
        await db
            .from("sales")
            .select("*")
            .order(
                "closed_at",
                { ascending: false }
            );


    salesHistoryBtn.disabled = false;


    if (error) {

        console.error(
            "Sales history error:",
            error
        );

        alert(
            "שגיאה בטעינת היסטוריית המכירות"
        );

        salesHistoryBtn.textContent =
            "📊 היסטוריית מכירות";

        return;
    }


    salesHistory.innerHTML = "";


    // אין מכירות
    if (!data || data.length === 0) {

        salesHistory.innerHTML = `
            <div style="
                background:#1f2937;
                border:1px solid #374151;
                border-radius:10px;
                padding:20px;
                text-align:center;
                color:#9ca3af;
            ">
                אין מכירות עדיין
            </div>
        `;

        salesHistory.style.display =
            "block";

        salesHistoryBtn.textContent =
            "✖ סגור היסטוריה";

        return;
    }


    /* =========================
       TOTAL SALES
    ========================= */

    const totalIncome =
        data.reduce(
            function(total, sale) {

                return total +
                    Number(
                        sale.total_amount || 0
                    );

            },
            0
        );


    const totalBox =
        document.createElement("div");


    totalBox.style.cssText = `
        background:#18212f;
        border:1px solid #374151;
        border-radius:10px;
        padding:18px;
        margin-bottom:20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:18px;
        font-weight:bold;
    `;


    const totalLabel =
        document.createElement("span");

    totalLabel.textContent =
        "סה״כ מכירות";


    const totalValue =
        document.createElement("span");

    totalValue.style.color =
        "#4ade80";

    totalValue.textContent =
        totalIncome.toFixed(2) +
        " ₪";


    totalBox.appendChild(
        totalLabel
    );

    totalBox.appendChild(
        totalValue
    );


    salesHistory.appendChild(
        totalBox
    );


    /* =========================
       SALES
    ========================= */

    data.forEach(
        function(sale) {

            const card =
                document.createElement(
                    "div"
                );


            card.style.cssText = `
                background:#1f2937;
                border:1px solid #374151;
                border-radius:10px;
                padding:18px;
                margin-bottom:12px;
            `;


            const topRow =
                document.createElement(
                    "div"
                );


            topRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:15px;
            `;


            const customerName =
                document.createElement(
                    "strong"
                );


            customerName.textContent =
                sale.customer_name ||
                "ללא שם";


            const dateElement =
                document.createElement(
                    "span"
                );


            dateElement.style.cssText = `
                color:#9ca3af;
                font-size:13px;
            `;


            const date =
                new Date(
                    sale.closed_at ||
                    sale.created_at
                );


            dateElement.textContent =
                date.toLocaleString(
                    "he-IL"
                );


            topRow.appendChild(
                customerName
            );


            topRow.appendChild(
                dateElement
            );


            card.appendChild(
                topRow
            );


            /* זמן */

            const timeRow =
                document.createElement(
                    "div"
                );


            timeRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                margin-bottom:9px;
            `;


            const timeLabel =
                document.createElement(
                    "span"
                );

            timeLabel.textContent =
                "זמן משחק";


            const timeValue =
                document.createElement(
                    "span"
                );

            timeValue.textContent =
                formatTime(
                    Number(
                        sale.elapsed_seconds ||
                        0
                    )
                );


            timeRow.appendChild(
                timeLabel
            );


            timeRow.appendChild(
                timeValue
            );


            card.appendChild(
                timeRow
            );


            /* עלות משחק */

            const gameRow =
                document.createElement(
                    "div"
                );


            gameRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                margin-bottom:9px;
            `;


            const gameLabel =
                document.createElement(
                    "span"
                );

            gameLabel.textContent =
                "עלות משחק";


            const gameValue =
                document.createElement(
                    "span"
                );

            gameValue.textContent =
                Number(
                    sale.game_cost || 0
                ).toFixed(2) +
                " ₪";


            gameRow.appendChild(
                gameLabel
            );


            gameRow.appendChild(
                gameValue
            );


            card.appendChild(
                gameRow
            );


            /* הזמנות */

            const ordersRow =
                document.createElement(
                    "div"
                );


            ordersRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                margin-bottom:9px;
            `;


            const ordersLabel =
                document.createElement(
                    "span"
                );

            ordersLabel.textContent =
                "הזמנות";


            const ordersValue =
                document.createElement(
                    "span"
                );

            ordersValue.textContent =
                Number(
                    sale.orders_cost || 0
                ).toFixed(2) +
                " ₪";


            ordersRow.appendChild(
                ordersLabel
            );


            ordersRow.appendChild(
                ordersValue
            );


            card.appendChild(
                ordersRow
            );


            /* סה"כ */

            const totalRow =
                document.createElement(
                    "div"
                );


            totalRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                border-top:1px solid #374151;
                padding-top:12px;
                margin-top:12px;
                font-size:18px;
                font-weight:bold;
                color:#4ade80;
            `;


            const saleTotalLabel =
                document.createElement(
                    "span"
                );

            saleTotalLabel.textContent =
                'סה"כ';


            const saleTotalValue =
                document.createElement(
                    "span"
                );

            saleTotalValue.textContent =
                Number(
                    sale.total_amount || 0
                ).toFixed(2) +
                " ₪";


            totalRow.appendChild(
                saleTotalLabel
            );


            totalRow.appendChild(
                saleTotalValue
            );


            card.appendChild(
                totalRow
            );


            salesHistory.appendChild(
                card
            );

        }
    );


    salesHistory.style.display =
        "block";


    salesHistoryBtn.textContent =
        "✖ סגור היסטוריה";
}

    /* =========================
   CLOSE ALL ACCOUNTS
========================= */

const closeAllBtn =
    document.getElementById("closeAllBtn");

closeAllBtn.addEventListener(
    "click",
    async function() {

        if (customers.length === 0) {
            alert("אין חשבונות פתוחים");
            return;
        }

        const password =
            prompt("🔐 הזן את סיסמת המערכת:");

        if (!password) {
            return;
        }

        /* בדיקת הסיסמה */
        const { error: passwordError } =
            await db.auth.signInWithPassword({
                email: ADMIN_EMAIL,
                password: password
            });

        if (passwordError) {
            alert("❌ סיסמה שגויה");
            return;
        }

        const confirmed =
            confirm(
                "⚠️ יש " +
                customers.length +
                " חשבונות פתוחים.\n\n" +
                "האם לסגור את כולם?"
            );

        if (!confirmed) {
            return;
        }

        closeAllBtn.disabled = true;
        closeAllBtn.textContent =
            "סוגר חשבונות...";

        let closedCount = 0;
        let totalClosed = 0;
        let failedCount = 0;

        /*
         * עובדים על עותק כדי שלא נשנה
         * את המערך בזמן הלולאה.
         */
        const customersToClose =
            [...customers];

        for (const customer of customersToClose) {

            const elapsedSeconds =
                getElapsedSeconds(customer);

            const gameCost =
                getGameCost(customer);

            const ordersCost =
                getOrdersCost(customer);

            const finalTotal =
                gameCost + ordersCost;


            /* שמירה ב-sales */
            const { error: saleError } =
                await db
                    .from("sales")
                    .insert({

                        customer_name:
                            customer.name,

                        hourly_price:
                            Number(
                                customer.hourlyPrice || 0
                            ),

                        elapsed_seconds:
                            elapsedSeconds,

                        game_cost:
                            Number(
                                gameCost.toFixed(2)
                            ),

                        orders_cost:
                            Number(
                                ordersCost.toFixed(2)
                            ),

                        total_amount:
                            Number(
                                finalTotal.toFixed(2)
                            ),

                        closed_at:
                            new Date().toISOString()

                    });


            /*
             * אם השמירה נכשלה —
             * לא מוחקים את הלקוח.
             */
            if (saleError) {

                console.error(
                    "Close all - sale error:",
                    customer.name,
                    saleError
                );

                failedCount++;

                continue;
            }


            /* מחיקת החשבון הפעיל */
            const { error: deleteError } =
                await db
                    .from("active_sessions")
                    .delete()
                    .eq(
                        "id",
                        customer.id
                    );


            if (deleteError) {

                console.error(
                    "Close all - delete error:",
                    customer.name,
                    deleteError
                );

                failedCount++;

                continue;
            }


            closedCount++;

            totalClosed +=
                finalTotal;


            customers =
                customers.filter(
                    function(item) {
                        return (
                            item.id !==
                            customer.id
                        );
                    }
                );
        }


        renderCustomers();


        closeAllBtn.disabled = false;

        closeAllBtn.textContent =
            "🔒 סגור את כל החשבונות";


        let message =
            "✅ נסגרו " +
            closedCount +
            " חשבונות.\n\n" +
            'סה"כ: ' +
            totalClosed.toFixed(2) +
            " ₪";


        if (failedCount > 0) {

            message +=
                "\n\n⚠️ " +
                failedCount +
                " חשבונות לא נסגרו בגלל שגיאה.";
        }


        alert(message);
    }
);
