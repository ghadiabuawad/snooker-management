<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snooker Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #0b1220;
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #263244;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            color: #9ca3af;
            margin-top: 6px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 35px auto;
        }

        .add-customer {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-customer input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-customer button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .section-title {
            margin-bottom: 15px;
        }

        .customer {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .customer-header {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .customer-name {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 3px;
        }

        .status.running {
            color: #4ade80;
        }

        .arrow {
            font-size: 18px;
        }

        .customer-details {
            display: none;
            padding: 20px;
            border-top: 1px solid #374151;
            background: #18212f;
        }

        .customer.open .customer-details {
            display: block;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .timer {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 22px 0 10px;
        }

        .game-cost {
            text-align: center;
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .start {
            background: #16a34a;
            color: white;
        }

        .stop {
            background: #dc2626;
            color: white;
        }

        .buttons button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .add-customer {
                flex-direction: column;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎱 Snooker Management</h1>
    <p>מערכת ניהול לקוחות</p>
</header>

<div class="container">

    <div class="add-customer">

        <input
            type="text"
            id="customerName"
            placeholder="שם הלקוח"
            autocomplete="off"
        >

        <button id="addCustomerBtn">
            + הוסף לקוח
        </button>

    </div>

    <h2 class="section-title">לקוחות פעילים</h2>

    <div id="customersList"></div>

</div>


<script>

const HOURLY_PRICE = 40;

const customerNameInput =
    document.getElementById("customerName");

const addCustomerBtn =
    document.getElementById("addCustomerBtn");

const customersList =
    document.getElementById("customersList");


function formatTime(totalSeconds) {

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0")
    );
}


function calculateGameCost(seconds) {

    return (seconds / 3600) * HOURLY_PRICE;

}


function addCustomer() {

    const customerName =
        customerNameInput.value.trim();

    if (customerName === "") {

        alert("יש להזין שם לקוח");
        return;

    }


    const customer =
        document.createElement("div");

    customer.className = "customer";


    customer.innerHTML = `

        <div class="customer-header">

            <div>

                <div class="customer-name"></div>

                <div class="status">
                    ● הזמן לא התחיל
                </div>

            </div>

            <div class="arrow">▼</div>

        </div>


        <div class="customer-details">

            <div class="info-row">

                <span>מחיר לשעה</span>

                <strong>
                    ${HOURLY_PRICE} ₪
                </strong>

            </div>


            <div class="timer">
                00:00:00
            </div>


            <div class="game-cost">
                עלות משחק: 0.00 ₪
            </div>


            <div class="buttons">

                <button class="start">
                    ▶ התחל זמן
                </button>

                <button class="stop" disabled>
                    ■ עצור
                </button>

            </div>

        </div>

    `;


    customer
        .querySelector(".customer-name")
        .textContent = customerName;


    const customerHeader =
        customer.querySelector(".customer-header");

    const arrow =
        customer.querySelector(".arrow");

    const timerElement =
        customer.querySelector(".timer");

    const costElement =
        customer.querySelector(".game-cost");

    const statusElement =
        customer.querySelector(".status");

    const startButton =
        customer.querySelector(".start");

    const stopButton =
        customer.querySelector(".stop");


    let totalSeconds = 0;

    let timerInterval = null;


    customerHeader.addEventListener(
        "click",
        function () {

            customer.classList.toggle("open");

            if (
                customer.classList.contains("open")
            ) {

                arrow.textContent = "▲";

            } else {

                arrow.textContent = "▼";

            }

        }
    );


    startButton.addEventListener(
        "click",
        function () {

            if (timerInterval !== null) {
                return;
            }


            statusElement.textContent =
                "● הזמן פועל";

            statusElement
                .classList
                .add("running");


            startButton.disabled = true;

            stopButton.disabled = false;


            timerInterval =
                setInterval(function () {

                    totalSeconds++;


                    timerElement.textContent =
                        formatTime(totalSeconds);


                    const gameCost =
                        calculateGameCost(
                            totalSeconds
                        );


                    costElement.textContent =
                        "עלות משחק: " +
                        gameCost.toFixed(2) +
                        " ₪";

                }, 1000);

        }
    );


    stopButton.addEventListener(
        "click",
        function () {

            if (timerInterval === null) {
                return;
            }


            clearInterval(timerInterval);

            timerInterval = null;


            statusElement.textContent =
                "● הזמן נעצר";

            statusElement
                .classList
                .remove("running");


            startButton.disabled = false;

            stopButton.disabled = true;

        }
    );


    customersList.appendChild(customer);


    customerNameInput.value = "";

    customerNameInput.focus();

}


addCustomerBtn.addEventListener(
    "click",
    addCustomer
);


customerNameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            addCustomer();

        }

    }
);

</script>

</body>
</html>
