function tableTimerState(table) {
    return {
        elapsedSeconds: Number(table.elapsed_seconds || 0),
        running: Boolean(table.running),
        startedAt: table.started_at ? new Date(table.started_at).getTime() : null,
        hourlyPrice: Number(table.hourly_price || 0)
    };
}

async function changeTableTimer(table, action) {
    if (gameTableSaves.has(table.id)) return;
    if (action === "stop" && !table.running) return;
    if (action === "resume" && table.running) return;
    if (action === "reset" && !confirm(
        "האם לאפס את הזמן ועלות המשחק של שולחן " + table.table_number + "?"
    )) return;

    const changes = {
        running: action === "resume",
        started_at: action === "resume" ? new Date().toISOString() : null,
        elapsed_seconds: action === "reset" ? 0 :
            getElapsedSeconds(tableTimerState(table)),
        updated_at: new Date().toISOString()
    };
    gameTableSaves.add(table.id);
    const refresh = function() {
        const update = gameTableDisplays.get(table.id);
        if (update) update();
    };
    refresh();
    try {
        const { data, error } = await db.from("game_tables")
            .update(changes).eq("id", table.id)
            .select("id, running, started_at, elapsed_seconds, updated_at").single();
        if (error) throw error;
        if (!data) throw new Error("No table was updated");
        Object.assign(table, data);
    } catch (error) {
        console.error("Save table timer error:", error);
        alert("שגיאה בשמירת הטיימר של שולחן " + table.table_number + ". נסה שוב.");
    } finally {
        gameTableSaves.delete(table.id);
        refresh();
    }
}

function customConfirm(message) {
    return new Promise(function(resolve) {
        const overlay = document.createElement("div");
        overlay.style.cssText =
            "position:fixed;inset:0;background:rgba(0,0,0,.7);" +
            "display:flex;align-items:center;justify-content:center;" +
            "z-index:2000;padding:20px;";

        const box = document.createElement("div");
        box.style.cssText =
            "background:#1f2937;border:1px solid #374151;border-radius:12px;" +
            "padding:24px;max-width:360px;width:100%;text-align:center;";

        const text = document.createElement("div");
        text.style.cssText =
            "font-size:16px;margin-bottom:20px;white-space:pre-line;line-height:1.6;";
        text.textContent = message;
        box.appendChild(text);

        const actions = document.createElement("div");
        actions.style.cssText = "display:flex;gap:10px;";

        function close(result) {
            overlay.remove();
            resolve(result);
        }

        const confirmBtn = document.createElement("button");
        confirmBtn.type = "button";
        confirmBtn.textContent = "✓ אישור";
        confirmBtn.style.cssText =
            "flex:1;padding:12px;background:#16a34a;color:white;font-weight:bold;";
        confirmBtn.addEventListener("click", function() { close(true); });

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.textContent = "ביטול";
        cancelBtn.style.cssText = "flex:1;padding:12px;background:#4b5563;color:white;";
        cancelBtn.addEventListener("click", function() { close(false); });

        actions.appendChild(confirmBtn);
        actions.appendChild(cancelBtn);
        box.appendChild(actions);

        overlay.appendChild(box);
        overlay.addEventListener("click", function(event) {
            if (event.target === overlay) close(false);
        });

        document.body.appendChild(overlay);
    });
}

function askWhoPays(playerNames) {
    return new Promise(function(resolve) {
        const overlay = document.createElement("div");
        overlay.style.cssText =

            "display:flex;align-items:center;justify-content:center;" +
            "z-index:1000;padding:20px;";

        const box = document.createElement("div");
        box.style.cssText =
            "background:#1f2937;border:1px solid #374151;border-radius:12px;" +
            "padding:24px;max-width:360px;width:100%;text-align:center;";

        const title = document.createElement("div");
        title.style.cssText = "font-size:18px;font-weight:bold;margin-bottom:6px;";
        title.textContent = "מי משלם?";
        box.appendChild(title);

        const subtitle = document.createElement("div");
        subtitle.style.cssText = "color:#9ca3af;font-size:13px;margin-bottom:16px;";
        subtitle.textContent = "אפשר לבחור כמה שחקנים - הסכום יתחלק ביניהם בשווה";
        box.appendChild(subtitle);

        const list = document.createElement("div");
        list.style.cssText = "display:flex;flex-direction:column;gap:10px;margin-bottom:15px;";

        const selected = new Set();

        function close(result) {
            overlay.remove();
            resolve(result);
        }

        playerNames.forEach(function(name, index) {
            const playerButton = document.createElement("button");
            playerButton.type = "button";
            playerButton.style.cssText =
                "padding:13px;color:white;font-weight:bold;font-size:16px;" +
                "border:2px solid transparent;background:#374151;";
            playerButton.textContent = "👤 " + name;

            function updateStyle() {
                if (selected.has(index)) {
                    playerButton.style.background = "#16a34a";
                    playerButton.style.borderColor = "#4ade80";
                    playerButton.textContent = "✓ " + name;
                } else {
                    playerButton.style.background = "#374151";
                    playerButton.style.borderColor = "transparent";
                    playerButton.textContent = "👤 " + name;
                }
            }

            playerButton.addEventListener("click", function() {
                if (selected.has(index)) {
                    selected.delete(index);
                } else {
                    selected.add(index);
                }
                updateStyle();
            });

            list.appendChild(playerButton);
        });

        box.appendChild(list);

        const confirmButton = document.createElement("button");
        confirmButton.type = "button";
        confirmButton.textContent = "✓ אישור";
        confirmButton.style.cssText =
            "width:100%;padding:12px;margin-bottom:10px;" +
            "background:#2563eb;color:white;font-weight:bold;font-size:16px;";
        confirmButton.addEventListener("click", function() {
            if (selected.size === 0) {
                alert("יש לבחור לפחות שחקן אחד");
                return;
            }
            close(
                Array.from(selected)
                    .sort(function(a, b) { return a - b; })
                    .map(function(index) { return playerNames[index]; })
            );
        });
        box.appendChild(confirmButton);

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.textContent = "ביטול";
        cancelButton.style.cssText =
            "width:100%;padding:11px;background:#4b5563;color:white;";
        cancelButton.addEventListener("click", function() {
            close(null);
        });
        box.appendChild(cancelButton);

        overlay.appendChild(box);
        overlay.addEventListener("click", function(event) {
            if (event.target === overlay) close(null);
        });

        document.body.appendChild(overlay);
    });
}


/* =========================

async function loadGameTables() {

    const { data, error } =
        await db
            .from("game_tables")
            .select(`
                *,
                table_players (*)
            `)
            .order(
                "table_number",

        );

        alert("שגיאה בטעינת שולחנות המשחק");

    }

    gameTables = data || [];

    renderGameTables();
}

const headerPlayers = tableElement.querySelector(".table-header-players");
if (players.length === 0) {

}
players.forEach(function(player) {

tableElement.addEventListener(

        });

        if (table.running || players.length > 0 || Number(table.elapsed_seconds) > 0) {

         <div

>
    עלות משחק: 0.00 ₪
</div>
         
        <div class="buttons">
            <button class="start table-resume">▶ התחל זמן</button>
            <button class="stop table-stop">■ עצור</button>

    tableElement.appendChild(details);

     const gameTableTimer =
    details.querySelector(".game-table-timer");
    const gameTableCost =
    details.querySelector(".game-table-cost");

const resumeTableButton = details.querySelector(".table-resume");
const stopTableButton = details.querySelector(".table-stop");
const resetTableButton = details.querySelector(".table-reset");
const tableTimerStatus = details.querySelector(".table-timer-status");

function updateGameTableTimer() {
    const state = tableTimerState(table);
    gameTableTimer.textContent = formatTime(getElapsedSeconds(state));
    gameTableCost.textContent = "עלות משחק: " + getGameCost(state).toFixed(2) + " ₪";

    const startLabel = tableElement.querySelector(".table-start-label");

}

resumeTableButton.addEventListener("click", function() {

stopTableButton.addEventListener("click", function() {

resetTableButton.addEventListener("click", function() {

gameTableDisplays.set(table.id, updateGameTableTimer);
updateGameTableTimer();

    const tableCheckoutButton =
    details.querySelector(".table-checkout");

    tableCheckoutButton.addEventListener("click", async function(event) {

        event.stopPropagation();

        if (players.length === 0) {
            alert("אין שחקנים בשולחן");

        if (table.running) {
            await changeTableTimer(table, "stop");

        const payerNames = await askWhoPays(

        const elapsedSeconds = getElapsedSeconds(finalState);
        const gameCost = getGameCost(finalState);

        const includeBarTab = {};
        for (const payerName of payerNames) {

            tableCheckoutButton.textContent = "✓ סגור חשבון";
            return;

        for (const payerName of payerNames) {
            if (includeBarTab[payerName]) {
                await db
                    .from("tab_orders")
                    .delete()
                    .eq("tab_name", payerName);
            }
        }

        tabOrders = tabOrders.filter(function(order) {
            return !includeBarTab[order.tab_name];
        });
        barNames = barNames.filter(function(n) {
            return !includeBarTab[n];
        });

        const { error: tableError } = await db
            .from("game_tables")
            .update({
                running: false,
                started_at: null,
                elapsed_seconds: 0,
                updated_at: new Date().toISOString()
            })
            .eq("id", table.id);

        const { error: playersError } = await db
            .from("table_players")
            .delete()
            .eq("table_id", table.id);

        if (tableError || playersError) {

async function loadProducts() {
    const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Load products error:", error);
        alert("שגיאה בטעינת רשימת המוצרים");
        return;
    }

    products = data || [];
}

async function loadTabOrders() {
    const { data, error } = await db
        .from("tab_orders")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Load tab orders error:", error);
        alert("שגיאה בטעינת ההזמנות הפתוחות");
        return;
    }

    tabOrders = data || [];
    renderBarNames();
}

========================= */

function getTabOrdersForName(name) {
    return tabOrders.filter(function(order) {
        return order.tab_name === name;
    });
}

function getTabTotal(name) {
    return getTabOrdersForName(name).reduce(function(sum, order) {
        return sum + Number(order.price || 0);
    }, 0);
}

function isActiveTablePlayer(name) {
    return gameTables.some(function(table) {
        return (table.table_players || []).some(function(player) {
            return player.player_name === name;
        });
    });
}

function getAllBarNames() {
    const names = new Set(barNames);

    gameTables.forEach(function(table) {
        (table.table_players || []).forEach(function(player) {
            names.add(player.player_name);
        });
    });

    tabOrders.forEach(function(order) {
        names.add(order.tab_name);
    });

    return Array.from(names);
}

function renderBarNames() {
    barNamesList.innerHTML = "";

    const names = getAllBarNames();

    if (names.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "color:#9ca3af;";
        empty.textContent = "אין לקוחות כרגע";
        barNamesList.appendChild(empty);
        return;
    }

    names.forEach(function(name) {
        const wrapper = document.createElement("div");
        wrapper.style.cssText = "display:flex;align-items:center;gap:4px;";

        const total = getTabTotal(name);

        const nameBtn = document.createElement("button");
        nameBtn.type = "button";
        nameBtn.textContent =
            "👤 " + name +
            (total > 0 ? " (" + total.toFixed(2) + " ₪)" : "");
        nameBtn.style.cssText =
            "padding:10px 14px;background:#2563eb;color:white;font-weight:bold;";
        nameBtn.addEventListener("click", function() {
            openTabModal(name);
        });
        wrapper.appendChild(nameBtn);

        if (total === 0 && !isActiveTablePlayer(name)) {
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.textContent = "✕";
            removeBtn.style.cssText = "padding:10px;background:#4b5563;color:white;";
            removeBtn.addEventListener("click", function() {
                barNames = barNames.filter(function(n) { return n !== name; });
                renderBarNames();
            });
            wrapper.appendChild(removeBtn);
        }

        barNamesList.appendChild(wrapper);
    });
}

addBarNameBtn.addEventListener("click", function() {

        items.forEach(function(product) {
            const btn = document.createElement("button");
            btn.type = "button";

                        product_name: product.name,
                        price: Number(product.price)

                    .select()
                    .single();
                btn.disabled = false;

                if (error) {
                    console.error("Add tab order error:", error);
                    alert("שגיאה בהוספת ההזמנה: " + error.message);

                }

                tabOrders.push(data);
                renderItems();
                renderBarNames();
            });
            productsGrid.appendChild(btn);
        });

    function renderTabs() {
        tabsRow.innerHTML = "";
        PRODUCT_CATEGORIES.forEach(function(category) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = category.label;
            btn.style.cssText =
                "padding:10px 4px;font-size:13px;font-weight:bold;color:white;" +
                (category.key === activeCategory ? "background:#2563eb;" : "background:#374151;");

                activeCategory = category.key;
                renderTabs();
                renderProducts();
            });
            tabsRow.appendChild(btn);
        });

        "background:#f59e0b;color:#111827;font-weight:bold;font-size:16px;";
    closeTabBtn.addEventListener("click", async function() {
        const total = getTabTotal(name);

        if (total <= 0) {
            alert("אין הזמנות לחשבון הזה");
            return;
        }

        const confirmed = confirm(
            "לסגור את החשבון של " + name + " על סך " + total.toFixed(2) + " ₪?"
        );
        if (!confirmed) return;

        closeTabBtn.disabled = true;
        closeTabBtn.textContent = "סוגר חשבון...";

        const { error: saleError } = await db
            .from("sales")
            .insert({
                customer_name: name,
                hourly_price: 0,
                elapsed_seconds: 0,
                game_cost: 0,
                orders_cost: Number(total.toFixed(2)),
                total_amount: Number(total.toFixed(2)),
                closed_at: new Date().toISOString()
            });

        if (saleError) {
            console.error("Close tab error:", saleError);
            alert("שגיאה בשמירת החשבון: " + saleError.message);
            closeTabBtn.disabled = false;
            closeTabBtn.textContent = "✓ סגור חשבון";
            return;
        }

        const { error: deleteError } = await db
            .from("tab_orders")
            .delete()
            .eq("tab_name", name);

        if (deleteError) {
            console.error("Clear tab orders error:", deleteError);
        }

        tabOrders = tabOrders.filter(function(order) {
            return order.tab_name !== name;
        });
        barNames = barNames.filter(function(n) {
            return n !== name;
        });

        overlay.remove();
        renderBarNames();
    });

    const closeModalBtn = document.createElement("button");
    closeModalBtn.type = "button";
    closeModalBtn.textContent = "סגור חלון";
    closeModalBtn.style.cssText = "width:100%;padding:11px;background:#4b5563;color:white;";
    closeModalBtn.addEventListener("click", function() {
        overlay.remove();
    });

    box.appendChild(closeTabBtn);
    box.appendChild(closeModalBtn);

    overlay.appendChild(box);
    overlay.addEventListener("click", function(event) {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);

    renderTabs();
    renderProducts();
    renderItems();
}

function buildMenuModalShell(titleText) {

        "display:flex;align-items:center;justify-content:center;" +

function addCategoryTabs(tabsRow, getActiveCategory, onSelect) {

                const confirmed = confirm("להסיר את \"" + product.name + "\" מהתפריט?");
                if (!confirmed) return;

                deleteBtn.disabled = true;
                const { error } = await db
                    .from("products")
                    .delete()
                    .eq("id", product.id);

                if (error) {
                    console.error("Delete product error:", error);
                    alert("שגיאה בהסרת המוצר: " + error.message);
                    deleteBtn.disabled = false;
                    return;
                }

                products = products.filter(function(p) {
                    return p.id !== product.id;
                });
                renderList();
            });

            row.appendChild(text);
            row.appendChild(deleteBtn);
            list.appendChild(row);
        });
    }

    addCategoryTabs(shell.tabsRow, function() { return activeCategory; }, function(key) {
        activeCategory = key;
        renderList();
    });

    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.textContent = "סגור";
    closeBtn.style.cssText = "width:100%;padding:11px;background:#4b5563;color:white;";
    closeBtn.addEventListener("click", function() {
        shell.overlay.remove();
    });
    shell.box.appendChild(closeBtn);

    document.body.appendChild(shell.overlay);
    renderList();
}

async function login() {

    const password =
        adminPassword.value;

    if (!password) {

        loginError.textContent =
            "נא להזין סיסמה";

        loginError.style.display =
            "block";

        return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
        "מתחבר...";

    loginError.style.display =
        "none";


    const { error } =
        await db.auth.signInWithPassword({

            email: ADMIN_EMAIL,

            password: password

        });


    if (error) {

        loginError.textContent =
            "הסיסמה שגויה";

        loginError.style.display =
            "block";

        loginBtn.disabled = false;

        loginBtn.textContent =
            "כניסה";

        return;
    }


    loginScreen.style.display =
        "none";

    app.style.display =
        "block";


    await loadGameTables();
    await loadProducts();
    await loadTabOrders();

    loginBtn.disabled = false;

    loginBtn.textContent =
        "כניסה";
}


loginBtn.addEventListener(
    "click",
    login
);


adminPassword.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

);

    const { data } =

        await loadGameTables();
        await loadProducts();
        await loadTabOrders();

        loginScreen.style.display =

        app.style.display =
            "none";

    }
}

/* =========================
   TIME
========================= */

    
function formatTime(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours).padStart(2, "0")
        + ":" +

        String(minutes).padStart(2, "0")
        + ":" +

        String(seconds).padStart(2, "0")

    );
}


function getElapsedSeconds(customer) {

    let seconds =
        Number(
            customer.elapsedSeconds
        ) || 0;


    if (
        customer.running &&
        customer.startedAt
    ) {

        seconds +=
            Math.floor(
                (
                    Date.now() -
                    customer.startedAt
                ) / 1000
            );

    }


    return Math.max(
        0,
        seconds
    );
}


function getGameCost(customer) {

    return (

        getElapsedSeconds(customer)
        / 3600

    ) * Number(
        customer.hourlyPrice || 0
    );
}

const salesHistoryBtn =
    document.getElementById("salesHistoryBtn");

const salesHistory =
    document.getElementById("salesHistory");


salesHistoryBtn.addEventListener(
    "click",
    loadSalesHistory
);


async function loadSalesHistory() {

    // אם ההיסטוריה כבר פתוחה - סגור אותה
    if (salesHistory.style.display === "block") {

        salesHistory.style.display = "none";

        salesHistoryBtn.textContent =
            "📊 היסטוריית מכירות";

        return;
    }


    salesHistoryBtn.disabled = true;

    salesHistoryBtn.textContent =
        "טוען...";


    const { data, error } =
        await db
            .from("sales")
            .select("*")
            .order(
                "closed_at",
                { ascending: false }
            );


    salesHistoryBtn.disabled = false;


    if (error) {

        console.error(
            "Sales history error:",
            error
        );

        alert(
            "שגיאה בטעינת היסטוריית המכירות"
        );

        salesHistoryBtn.textContent =
            "📊 היסטוריית מכירות";

        return;
    }


    salesHistory.innerHTML = "";


    // אין מכירות
    if (!data || data.length === 0) {

        salesHistory.innerHTML = `
            <div style="
                background:#1f2937;
                border:1px solid #374151;
                border-radius:10px;
                padding:20px;
                text-align:center;
                color:#9ca3af;
            ">
                אין מכירות עדיין
            </div>

            "block";

        salesHistoryBtn.textContent =
            "✖ סגור היסטוריה";

        return;
    }


    /* =========================
       TOTAL SALES
    ========================= */

    const totalIncome =
        data.reduce(
            function(total, sale) {

                return total +
                    Number(
                        sale.total_amount || 0
                    );

            },
            0

    const totalBox =
        document.createElement("div");


    totalBox.style.cssText = `
        background:#18212f;
        border:1px solid #374151;
        border-radius:10px;
        padding:18px;
        margin-bottom:20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:18px;
        font-weight:bold;

        document.createElement("span");

        "סה״כ מכירות";

        document.createElement("span");

        "#4ade80";

    );

    totalBox.appendChild(
        totalValue
    );


    salesHistory.appendChild(
        totalBox
    );


    /* =========================
       SALES
    ========================= */

    data.forEach(
        function(sale) {

            const card =

                    "div"
                );


            card.style.cssText = `
                background:#1f2937;
                border:1px solid #374151;
                border-radius:10px;
                padding:18px;
                margin-bottom:12px;
            `;


            const topRow =
                document.createElement(
                    "div"
                );


            topRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:15px;
            `;


            const customerName =
                document.createElement(
                    "strong"
                );


            customerName.textContent =
                sale.customer_name ||
                "ללא שם";


            const dateElement =
                document.createElement(
                    "span"
                );


            dateElement.style.cssText = `
                color:#9ca3af;
                font-size:13px;
            `;


            const date =
                new Date(
                    sale.closed_at ||
                    sale.created_at
                );


            dateElement.textContent =
                date.toLocaleString(
                    "he-IL"
                );


            topRow.appendChild(
                customerName
            );


            topRow.appendChild(
                dateElement
            );


            card.appendChild(
                topRow
            );


            /* זמן */

            const timeRow =
                document.createElement(
                    "div"
                );


            timeRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                margin-bottom:9px;
            `;


            const timeLabel =
                document.createElement(
                    "span"
                );

            timeLabel.textContent =
                "זמן משחק";


            const timeValue =
                document.createElement(
                    "span"
                );

            timeValue.textContent =
                formatTime(
                    Number(
                        sale.elapsed_seconds ||
                        0
                    )
                );


            timeRow.appendChild(
                timeLabel
            );


            timeRow.appendChild(
                timeValue
            );


            card.appendChild(
                timeRow
            );


            /* עלות משחק */

            const gameRow =
                document.createElement(
                    "div"
                );


            gameRow.style.cssText = `

                justify-content:space-between;

            `;


            const gameLabel =
                document.createElement(
                    "span"
                );

            gameLabel.textContent =
                "עלות משחק";

                document.createElement(
                    "span"
                );

            gameValue.textContent =
                Number(
                    sale.game_cost || 0
                ).toFixed(2) +
                " ₪";


            gameRow.appendChild(
                gameLabel
            );


            gameRow.appendChild(
                gameValue
            );


            card.appendChild(
                gameRow
            );


            /* הזמנות */

                );

                display:flex;
                justify-content:space-between;
                margin-bottom:9px;
            `;


            const ordersLabel =
                document.createElement(
                    "span"
                );

            ordersLabel.textContent =

                document.createElement(

                );

                );

                    "span"
                );

            saleTotalValue.textContent =

                    sale.total_amount || 0

            totalRow.appendChild(

            );


            totalRow.appendChild(
                saleTotalValue
            );


            card.appendChild(
                totalRow
            );

            );

    );
