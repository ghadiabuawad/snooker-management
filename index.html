<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snooker Management</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    min-height:100vh
}

header{
    background:#0b1220;
    padding:22px;
    text-align:center;
    border-bottom:1px solid #263244
}

header h1{font-size:28px}
header p{color:#9ca3af;margin-top:6px}

.container{
    width:90%;
    max-width:800px;
    margin:35px auto
}

.add-customer{
    display:flex;
    gap:10px;
    margin-bottom:30px
}

input{
    padding:12px;
    border:none;
    border-radius:7px;
    font-size:16px
}

.add-customer input{flex:1}

button{
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:15px
}

.add-customer button{
    padding:12px 20px;
    background:#16a34a;
    color:white
}

.section-title{margin-bottom:15px}

.customer{
    background:#1f2937;
    border:1px solid #374151;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden
}

.customer-header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer
}

.customer-name{
    font-size:18px;
    font-weight:bold
}

.status{
    color:#9ca3af;
    font-size:14px;
    margin-top:3px
}

.status.running{color:#4ade80}

.customer-details{
    display:none;
    padding:20px;
    border-top:1px solid #374151;
    background:#18212f
}

.customer.open .customer-details{display:block}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px
}

.hour-price{
    width:100px;
    text-align:center
}

.timer{
    font-size:32px;
    font-weight:bold;
    text-align:center;
    margin:20px 0 8px
}

.game-cost{
    text-align:center;
    color:#4ade80;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px
}

.buttons{
    display:flex;
    gap:10px;
    margin-bottom:25px
}

.buttons button{
    flex:1;
    padding:12px
}

.start{
    background:#16a34a;
    color:white
}

.stop{
    background:#dc2626;
    color:white
}

button:disabled{
    opacity:.45;
    cursor:not-allowed
}

.orders{
    border-top:1px solid #374151;
    padding-top:20px
}

.orders h3{
    margin-bottom:15px
}

.add-order{
    display:grid;
    grid-template-columns:1fr 120px auto;
    gap:8px;
    margin-bottom:15px
}

.add-order button{
    background:#2563eb;
    color:white;
    padding:10px 15px
}

.orders-list{
    margin-bottom:20px
}

.order-item{
    background:#111827;
    padding:10px;
    border-radius:7px;
    margin-bottom:7px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px
}

.remove-order{
    background:#7f1d1d;
    color:white;
    padding:7px 10px
}

.summary{
    border-top:1px solid #374151;
    padding-top:18px
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#4ade80;
    border-top:1px solid #374151;
    padding-top:15px;
    margin-top:15px
}

.checkout{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#f59e0b;
    color:#111827;
    font-weight:bold;
    font-size:17px
}

@media(max-width:600px){
    .add-customer,
    .buttons{
        flex-direction:column
    }

    .add-order{
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>

<header>
    <h1>🎱הנהלת חשבונות🎱</h1>
    <p>מערכת ניהול לקוחות</p>
</header>

<div class="container">

    <div class="add-customer">
        <input
            id="customerName"
            type="text"
            placeholder="שם הלקוח"
            autocomplete="off"
        >

        <button id="addCustomerBtn">
            + הוסף לקוח
        </button>
    </div>

    <h2 class="section-title">לקוחות פעילים</h2>

    <div id="customersList"></div>

</div>
    
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://wcvoveewsfxffjbqiyzh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ufwo_QB9AdKZor-0_QnP1w_Fs7QYtX5";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

console.log("Supabase connected");


    
const DEFAULT_HOURLY_PRICE = 40;
const STORAGE_KEY = "snookerCustomers";

const customerNameInput = document.getElementById("customerName");
const addCustomerBtn = document.getElementById("addCustomerBtn");
const customersList = document.getElementById("customersList");

let customers = loadCustomers();


function loadCustomers() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
    } catch (error) {
        return [];
    }
}


function saveCustomers() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(customers)
    );
}


function createId() {
    return Date.now().toString() +
        Math.random().toString(16).slice(2);
}


function formatTime(totalSeconds) {

    totalSeconds = Math.max(
        0,
        Math.floor(totalSeconds)
    );

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0")
    );
}


function getElapsedSeconds(customer) {

    let seconds =
        customer.elapsedSeconds || 0;

    if (
        customer.running &&
        customer.startedAt
    ) {

        seconds += Math.floor(
            (Date.now() - customer.startedAt) / 1000
        );

    }

    return seconds;
}


function getGameCost(customer) {

    return (
        getElapsedSeconds(customer) / 3600
    ) * customer.hourlyPrice;

}


function getOrdersCost(customer) {

    return customer.orders.reduce(
        function(total, order) {
            return total + order.price;
        },
        0
    );

}


function addCustomer() {

    const name =
        customerNameInput.value.trim();

    if (!name) {
        alert("יש להזין שם לקוח");
        return;
    }


    const newCustomer = {

        id: createId(),

        name: name,

        hourlyPrice:
            DEFAULT_HOURLY_PRICE,

        elapsedSeconds: 0,

        running: false,

        startedAt: null,

        orders: [],

        open: false
    };


    customers.push(newCustomer);

    saveCustomers();

    renderCustomers();


    customerNameInput.value = "";

    customerNameInput.focus();
}


function renderCustomers() {

    customersList.innerHTML = "";


    customers.forEach(function(customer) {

        const customerElement =
            document.createElement("div");

        customerElement.className =
            "customer";

        if (customer.open) {
            customerElement.classList.add("open");
        }


        customerElement.innerHTML = `

            <div class="customer-header">

                <div>

                    <div class="customer-name"></div>

                    <div class="status"></div>

                </div>

                <div class="arrow">
                    ${customer.open ? "▲" : "▼"}
                </div>

            </div>


            <div class="customer-details">

                <div class="info-row">

                    <span>מחיר לשעה</span>

                    <div>

                        <input
                            class="hour-price"
                            type="number"
                            min="0"
                            step="1"
                        >

                        ₪

                    </div>

                </div>


                <div class="timer">
                    00:00:00
                </div>


                <div class="game-cost">
                    עלות משחק: 0.00 ₪
                </div>


                <div class="buttons">

                    <button class="start">
                        ▶ התחל זמן
                    </button>

                    <button class="stop">
                        ■ עצור
                    </button>

                </div>


                <div class="orders">

                    <h3>הזמנות</h3>


                    <div class="add-order">

                        <input
                            class="order-name"
                            type="text"
                            placeholder="שם המוצר"
                        >

                        <input
                            class="order-price"
                            type="number"
                            min="0"
                            step="0.5"
                            placeholder="מחיר ₪"
                        >

                        <button class="add-order-btn">
                            + הוסף
                        </button>

                    </div>


                    <div class="orders-list"></div>


                    <div class="summary">

                        <div class="summary-row">

                            <span>זמן משחק</span>

                            <strong class="summary-game">
                                0.00 ₪
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>הזמנות</span>

                            <strong class="summary-orders">
                                0.00 ₪
                            </strong>

                        </div>


                        <div class="summary-row total">

                            <span>סה"כ לתשלום</span>

                            <strong class="summary-total">
                                0.00 ₪
                            </strong>

                        </div>

                    </div>


                    <button class="checkout">
                        ✓ סגור חשבון
                    </button>

                </div>

            </div>
        `;


        const nameElement =
            customerElement.querySelector(
                ".customer-name"
            );

        const statusElement =
            customerElement.querySelector(
                ".status"
            );

        const header =
            customerElement.querySelector(
                ".customer-header"
            );

        const timerElement =
            customerElement.querySelector(
                ".timer"
            );

        const gameCostElement =
            customerElement.querySelector(
                ".game-cost"
            );

        const hourlyPriceInput =
            customerElement.querySelector(
                ".hour-price"
            );

        const startButton =
            customerElement.querySelector(
                ".start"
            );

        const stopButton =
            customerElement.querySelector(
                ".stop"
            );

        const orderNameInput =
            customerElement.querySelector(
                ".order-name"
            );

        const orderPriceInput =
            customerElement.querySelector(
                ".order-price"
            );

        const addOrderButton =
            customerElement.querySelector(
                ".add-order-btn"
            );

        const ordersList =
            customerElement.querySelector(
                ".orders-list"
            );

        const summaryGame =
            customerElement.querySelector(
                ".summary-game"
            );

        const summaryOrders =
            customerElement.querySelector(
                ".summary-orders"
            );

        const summaryTotal =
            customerElement.querySelector(
                ".summary-total"
            );

        const checkoutButton =
            customerElement.querySelector(
                ".checkout"
            );


        nameElement.textContent =
            customer.name;

        hourlyPriceInput.value =
            customer.hourlyPrice;


        function updateDisplay() {

            const seconds =
                getElapsedSeconds(customer);

            const gameCost =
                getGameCost(customer);

            const ordersCost =
                getOrdersCost(customer);

            const total =
                gameCost + ordersCost;


            timerElement.textContent =
                formatTime(seconds);


            gameCostElement.textContent =
                "עלות משחק: " +
                gameCost.toFixed(2) +
                " ₪";


            summaryGame.textContent =
                gameCost.toFixed(2) +
                " ₪";


            summaryOrders.textContent =
                ordersCost.toFixed(2) +
                " ₪";


            summaryTotal.textContent =
                total.toFixed(2) +
                " ₪";


            if (customer.running) {

                statusElement.textContent =
                    "● הזמן פועל";

                statusElement.classList.add(
                    "running"
                );

                startButton.disabled = true;
                stopButton.disabled = false;

            } else {

                statusElement.classList.remove(
                    "running"
                );

                if (
                    customer.elapsedSeconds > 0
                ) {

                    statusElement.textContent =
                        "● הזמן נעצר";

                } else {

                    statusElement.textContent =
                        "● הזמן לא התחיל";

                }

                startButton.disabled = false;
                stopButton.disabled = true;
            }
        }


        function renderOrders() {

            ordersList.innerHTML = "";


            if (customer.orders.length === 0) {

                const empty =
                    document.createElement("div");

                empty.style.color =
                    "#9ca3af";

                empty.style.marginBottom =
                    "15px";

                empty.textContent =
                    "אין הזמנות עדיין";

                ordersList.appendChild(empty);

                return;
            }


            customer.orders.forEach(
                function(order, index) {

                    const item =
                        document.createElement("div");

                    item.className =
                        "order-item";


                    const text =
                        document.createElement("span");

                    text.textContent =
                        order.name +
                        " — " +
                        order.price.toFixed(2) +
                        " ₪";


                    const removeButton =
                        document.createElement("button");

                    removeButton.className =
                        "remove-order";

                    removeButton.textContent =
                        "מחק";


                    removeButton.addEventListener(
                        "click",
                        function() {

                            customer.orders.splice(
                                index,
                                1
                            );

                            saveCustomers();

                            renderOrders();

                            updateDisplay();
                        }
                    );


                    item.appendChild(text);

                    item.appendChild(
                        removeButton
                    );

                    ordersList.appendChild(item);
                }
            );
        }


        header.addEventListener(
            "click",
            function() {

                customer.open =
                    !customer.open;

                saveCustomers();

                renderCustomers();
            }
        );


        startButton.addEventListener(
            "click",
            function() {

                if (customer.running) {
                    return;
                }


                customer.running = true;

                customer.startedAt =
                    Date.now();


                saveCustomers();

                updateDisplay();
            }
        );


        stopButton.addEventListener(
            "click",
            function() {

                if (!customer.running) {
                    return;
                }


                const extraSeconds =
                    Math.floor(
                        (
                            Date.now() -
                            customer.startedAt
                        ) / 1000
                    );


                customer.elapsedSeconds +=
                    extraSeconds;


                customer.running = false;

                customer.startedAt = null;


                saveCustomers();

                updateDisplay();
            }
        );


        hourlyPriceInput.addEventListener(
            "input",
            function() {

                const newPrice =
                    Number(
                        hourlyPriceInput.value
                    );


                if (
                    Number.isFinite(newPrice) &&
                    newPrice >= 0
                ) {

                    customer.hourlyPrice =
                        newPrice;

                    saveCustomers();

                    updateDisplay();
                }
            }
        );


        function addOrder() {

            const orderName =
                orderNameInput.value.trim();

            const orderPrice =
                Number(
                    orderPriceInput.value
                );


            if (!orderName) {

                alert(
                    "יש להזין שם מוצר"
                );

                return;
            }


            if (
                !Number.isFinite(orderPrice) ||
                orderPrice < 0
            ) {

                alert(
                    "יש להזין מחיר תקין"
                );

                return;
            }


            customer.orders.push({

                name: orderName,

                price: orderPrice

            });


            saveCustomers();


            orderNameInput.value = "";

            orderPriceInput.value = "";


            renderOrders();

            updateDisplay();

            orderNameInput.focus();
        }


        addOrderButton.addEventListener(
            "click",
            addOrder
        );


        orderPriceInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    addOrder();
                }
            }
        );


        checkoutButton.addEventListener(
            "click",
            function() {

                const gameCost =
                    getGameCost(customer);

                const ordersCost =
                    getOrdersCost(customer);

                const finalTotal =
                    gameCost + ordersCost;


                const confirmed =
                    confirm(

                        "לסגור את החשבון של " +
                        customer.name +
                        "?\n\n" +

                        "זמן משחק: " +
                        gameCost.toFixed(2) +
                        " ₪\n" +

                        "הזמנות: " +
                        ordersCost.toFixed(2) +
                        " ₪\n\n" +

                        'סה"כ: ' +
                        finalTotal.toFixed(2) +
                        " ₪"
                    );


                if (!confirmed) {
                    return;
                }


                customers =
                    customers.filter(
                        function(item) {

                            return (
                                item.id !==
                                customer.id
                            );
                        }
                    );


                saveCustomers();

                renderCustomers();
            }
        );


        renderOrders();

        updateDisplay();

        customersList.appendChild(
            customerElement
        );
    });
}


addCustomerBtn.addEventListener(
    "click",
    addCustomer
);


customerNameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            addCustomer();
        }
    }
);


/*
    מרענן את התצוגה כל שנייה.
    הזמן עצמו מחושב לפי השעון האמיתי,
    ולכן סגירת האתר לא עוצרת אותו.
*/
setInterval(
    function() {

        const customerElements =
            customersList.querySelectorAll(
                ".customer"
            );


        customerElements.forEach(
            function(element, index) {

                const customer =
                    customers[index];

                if (
                    !customer ||
                    !customer.running
                ) {
                    return;
                }


                const timer =
                    element.querySelector(
                        ".timer"
                    );

                const gameCostElement =
                    element.querySelector(
                        ".game-cost"
                    );

                const summaryGame =
                    element.querySelector(
                        ".summary-game"
                    );

                const summaryOrders =
                    element.querySelector(
                        ".summary-orders"
                    );

                const summaryTotal =
                    element.querySelector(
                        ".summary-total"
                    );


                const seconds =
                    getElapsedSeconds(customer);

                const gameCost =
                    getGameCost(customer);

                const ordersCost =
                    getOrdersCost(customer);

                const total =
                    gameCost + ordersCost;


                timer.textContent =
                    formatTime(seconds);


                gameCostElement.textContent =
                    "עלות משחק: " +
                    gameCost.toFixed(2) +
                    " ₪";


                summaryGame.textContent =
                    gameCost.toFixed(2) +
                    " ₪";


                summaryOrders.textContent =
                    ordersCost.toFixed(2) +
                    " ₪";


                summaryTotal.textContent =
                    total.toFixed(2) +
                    " ₪";
            }
        );

    },
    1000
);


renderCustomers();

</script>
</body>
</html>
