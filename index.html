function tableTimerState(table) {
    return {
        elapsedSeconds: Number(table.elapsed_seconds || 0),
        running: Boolean(table.running),
        startedAt: table.started_at ? new Date(table.started_at).getTime() : null,
        hourlyPrice: Number(table.hourly_price || 0)
    };
}

async function changeTableTimer(table, action) {
    if (gameTableSaves.has(table.id)) return;
    if (action === "stop" && !table.running) return;
    if (action === "resume" && table.running) return;
    if (action === "reset" && !confirm(
        "האם לאפס את הזמן ועלות המשחק של שולחן " + table.table_number + "?"
    )) return;

    const changes = {
        running: action === "resume",
        started_at: action === "resume" ? new Date().toISOString() : null,
        elapsed_seconds: action === "reset" ? 0 :
            getElapsedSeconds(tableTimerState(table)),
        updated_at: new Date().toISOString()
    };
    gameTableSaves.add(table.id);
    const refresh = function() {
        const update = gameTableDisplays.get(table.id);
        if (update) update();
    };
    refresh();
    try {
        const { data, error } = await db.from("game_tables")
            .update(changes).eq("id", table.id)
            .select("id, running, started_at, elapsed_seconds, updated_at").single();
        if (error) throw error;
        if (!data) throw new Error("No table was updated");
        Object.assign(table, data);
    } catch (error) {
        console.error("Save table timer error:", error);
        alert("שגיאה בשמירת הטיימר של שולחן " + table.table_number + ". נסה שוב.");
    } finally {
        gameTableSaves.delete(table.id);
        refresh();
    }
}

/* =========================
   TIME
========================= */

    
function formatTime(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours).padStart(2, "0")
        + ":" +

        String(minutes).padStart(2, "0")
        + ":" +

        String(seconds).padStart(2, "0")

    );
}


function getElapsedSeconds(customer) {

    let seconds =
        Number(
            customer.elapsedSeconds
        ) || 0;


    if (
        customer.running &&
        customer.startedAt
    ) {

        seconds +=
            Math.floor(
                (
                    Date.now() -
                    customer.startedAt
                ) / 1000
            );

    }


    return Math.max(
        0,
        seconds
    );
}


function getGameCost(customer) {

    return (

        getElapsedSeconds(customer)
        / 3600

    ) * Number(
        customer.hourlyPrice || 0
    );
}

            const gameValue =

                    "span"
                );

            gameValue.textContent =

                ).toFixed(2) +

            gameRow.appendChild(
                gameLabel
            );


            gameRow.appendChild(
                gameValue
            );


            card.appendChild(
                gameRow
            );


            /* הזמנות */

            const ordersRow =
                document.createElement(

                );


            ordersRow.style.cssText = `
                display:flex;
                justify-content:space-between;

            `;


            const ordersLabel =

                    "span"
                );

            ordersLabel.textContent =
                "הזמנות";


            const ordersValue =
                document.createElement(
                    "span"
                );

            ordersValue.textContent =
                Number(
                    sale.orders_cost || 0
                ).toFixed(2) +
                " ₪";


            ordersRow.appendChild(
                ordersLabel
            );


            ordersRow.appendChild(
                ordersValue
            );


            card.appendChild(
                ordersRow
            );


            /* סה"כ */

            const totalRow =
                document.createElement(
                    "div"
                );


            totalRow.style.cssText = `
                display:flex;
                justify-content:space-between;
                border-top:1px solid #374151;
                padding-top:12px;
                margin-top:12px;
                font-size:18px;
                font-weight:bold;
                color:#4ade80;
            `;


            const saleTotalLabel =
                document.createElement(
                    "span"
                );

            saleTotalLabel.textContent =
                'סה"כ';


            const saleTotalValue =
                document.createElement(
                    "span"
                );

            saleTotalValue.textContent =
                Number(
                    sale.total_amount || 0
                ).toFixed(2) +

            totalRow.appendChild(
                saleTotalLabel
            );


            totalRow.appendChild(

            );


            card.appendChild(
                totalRow
            );


            salesHistory.appendChild(

            );

        }
    );


    salesHistory.style.display =
        "block";


    salesHistoryBtn.textContent =
        "✖ סגור היסטוריה";
}
/* =========================
   LOGOUT
========================= */

const logoutBtn =
    document.getElementById("logoutBtn");


logoutBtn.addEventListener(
    "click",
    async function() {

        const confirmed =
            confirm("האם אתה בטוח שברצונך להתנתק?");

        if (!confirmed) {
            return;
        }


        logoutBtn.disabled = true;

        logoutBtn.textContent =
            "מתנתק...";


        const { error } =
            await db.auth.signOut();


        if (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "שגיאה בהתנתקות"
            );

            logoutBtn.disabled = false;

            logoutBtn.textContent =
                "🚪 התנתק";

            return;
        }


        gameTables = [];
        gameTableDisplays.clear();
        gameTablesList.innerHTML = "";

        salesHistory.innerHTML = "";

        salesHistory.style.display =
            "none";


        adminPassword.value = "";

        loginError.style.display =
            "none";


        app.style.display =
            "none";

        loginScreen.style.display =
            "flex";


        logoutBtn.disabled = false;

        logoutBtn.textContent =
            "🚪 התנתק";

    }
);
</script>
