function tableTimerState(table) {
    return {
        elapsedSeconds: Number(table.elapsed_seconds || 0),
        running: Boolean(table.running),
        startedAt: table.started_at ? new Date(table.started_at).getTime() : null,
        hourlyPrice: Number(table.hourly_price || 0)
    };
}

async function changeTableTimer(table, action) {
    if (gameTableSaves.has(table.id)) return;
    if (action === "stop" && !table.running) return;
    if (action === "resume" && table.running) return;
    if (action === "reset" && !(await customConfirm(
        "האם לאפס את הזמן ועלות המשחק של שולחן " + table.table_number + "?"
    ))) return;

    const changes = {
        running: action === "resume",
        started_at: action === "resume" ? new Date().toISOString() : null,
        elapsed_seconds: action === "reset" ? 0 :
            getElapsedSeconds(tableTimerState(table)),
        updated_at: new Date().toISOString()
    };
    gameTableSaves.add(table.id);
    const refresh = function() {
        const update = gameTableDisplays.get(table.id);
        if (update) update();
    };
    refresh();
    try {
        const { data, error } = await db.from("game_tables")
            .update(changes).eq("id", table.id)
            .select("id, running, started_at, elapsed_seconds, updated_at").single();
        if (error) throw error;
        if (!data) throw new Error("No table was updated");
        Object.assign(table, data);
    } catch (error) {
        console.error("Save table timer error:", error);
        alert("שגיאה בשמירת הטיימר של שולחן " + table.table_number + ". נסה שוב.");
    } finally {
        gameTableSaves.delete(table.id);
        refresh();
    }
}

function toTimeInputValue(isoString) {
    if (!isoString) return "";
    const d = new Date(isoString);
    const pad = function(n) { return String(n).padStart(2, "0"); };
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

        });

            display.textContent = String(getValue()).padStart(2, "0");
        });

        wrap.appendChild(upBtn);
        wrap.appendChild(display);
        wrap.appendChild(downBtn);
        return wrap;
    }

    const hourStepper = buildStepper(
        function() { return hourValue; },
        function(delta) { hourValue = ((hourValue + delta) % 24 + 24) % 24; }
    );

                    .insert({
                        table_id: table.id,
                        player_name: newName,
                        position: nextPosition
                    });

                nextPosition++;

                if (error) {
                    console.error("Add player error:", error);
                    hadError = true;
                }

                continue;
            }

            if (!newName || newName === entry.original) continue;

            const { error } = await db
                .from("table_players")
                .update({ player_name: newName })
                .eq("id", entry.id);

            if (error) {
                console.error("Edit player name error:", error);
                hadError = true;
            }
        }

        if (removedPlayerIds.length > 0) {
            const { error } = await db
                .from("table_players")
                .delete()
                .in("id", removedPlayerIds);

            if (error) {
                console.error("Remove player error:", error);
                hadError = true;
            }
        }

        if (nameInputs.length === 0) {
            const { error } = await db
                .from("game_tables")
                .update({ running: false, started_at: null, elapsed_seconds: 0 })
                .eq("id", table.id);

            if (error) {
                console.error("Reset empty table error:", error);
                hadError = true;
            }
        } else {
            const baseDate = table.started_at ? new Date(table.started_at) : new Date();
            baseDate.setHours(hourValue, minuteValue, 0, 0);
            const newStartedAt = baseDate.toISOString();
            if (newStartedAt !== table.started_at) {
                const { error } = await db
                    .from("game_tables")
                    .update({ started_at: newStartedAt })
                    .eq("id", table.id);

                if (error) {
                    console.error("Edit start time error:", error);
                    hadError = true;
                }
            }
        }

        if (hadError) {
            alert("היתה שגיאה בשמירת חלק מהשינויים. נסה שוב.");
            saveBtn.disabled = false;
            saveBtn.textContent = "✓ שמור שינויים";
            return;
        }

        overlay.remove();
        await loadGameTables();
    });
    box.appendChild(saveBtn);

    const cancelBtn = document.createElement("button");

    overlay.appendChild(box);

        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
}


/* =========================
   LOAD GAME TABLES
========================= */

async function loadGameTables() {

    const { data, error } =
        await db
            .from("game_tables")
            .select(`
                *,
                table_players (*)
            `)
            .order(
                "table_number",
                { ascending: false }
            );

    if (error) {
        console.error(
            "Load game tables error:",
            error
        );

        alert("שגיאה בטעינת שולחנות המשחק");
        return;
    }

    gameTables = data || [];

    const emptyTablesToReset = gameTables.filter(function(table) {
        const hasPlayers = (table.table_players || []).length > 0;
        return !hasPlayers && (table.running || table.started_at || Number(table.elapsed_seconds) > 0);
    });

    if (emptyTablesToReset.length > 0) {
        const { error: resetError } = await db
            .from("game_tables")
            .update({ running: false, started_at: null, elapsed_seconds: 0 })
            .in("id", emptyTablesToReset.map(function(t) { return t.id; }));

        if (resetError) {
            console.error("Auto-reset empty table error:", resetError);
        } else {
            emptyTablesToReset.forEach(function(table) {
                table.running = false;
                table.started_at = null;
                table.elapsed_seconds = 0;
            });
        }
    }

    renderGameTables();
}

   LOAD PRODUCTS / TAB ORDERS
========================= */

async function loadProducts() {
    const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Load products error:", error);
        alert("שגיאה בטעינת רשימת המוצרים");
        return;
    }

    products = data || [];
}

async function loadTabOrders() {
    const { data, error } = await db
        .from("tab_orders")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Load tab orders error:", error);
        alert("שגיאה בטעינת ההזמנות הפתוחות");
        return;
    }

    tabOrders = data || [];
    renderBarNames();
}

async function loadBarTabs() {
    const { data, error } = await db
        .from("bar_tabs")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Load bar tabs error:", error);
        alert("שגיאה בטעינת רשימת הלקוחות");
        return;
    }

    barNames = (data || []).map(function(row) { return row.name; });
    renderBarNames();
}

/* =========================
   BAR TABS (CUSTOMERS)
========================= */

function getTabOrdersForName(name) {
    return tabOrders.filter(function(order) {
        return order.tab_name === name;
    });
}

function getTabTotal(name) {
    return getTabOrdersForName(name).reduce(function(sum, order) {
        return sum + Number(order.price || 0);
    }, 0);
}

function getDebtNames() {
    const names = new Set();
    tabOrders.forEach(function(order) {
        if (order.is_debt) names.add(order.tab_name);
    });
    return Array.from(names);
}

function getDebtOrdersForName(name) {
    return tabOrders.filter(function(order) {
        return order.tab_name === name && order.is_debt;
    });
}

function getDebtTotal(name) {
    return getDebtOrdersForName(name).reduce(function(sum, order) {
        return sum + Number(order.price || 0);
    }, 0);
}

function buildDebtItemsSummary(name) {
    const orders = getDebtOrdersForName(name);
    const grouped = new Map();
    orders.forEach(function(order) {
        const key = order.product_name;
        grouped.set(key, (grouped.get(key) || 0) + 1);
    });

    return Array.from(grouped.entries()).map(function(entry) {
        return entry[1] > 1 ? entry[0] + " ×" + entry[1] : entry[0];
    }).join(", ");
}

function openDebtsModal() {
    const overlay = document.createElement("div");
    overlay.style.cssText =
        "position:fixed;inset:0;background:rgba(0,0,0,.65);" +
        "display:flex;align-items:center;justify-content:center;" +
        "z-index:1000;padding:20px;";

    const box = document.createElement("div");
    box.style.cssText =
        "background:#1f2937;border:1px solid #374151;border-radius:12px;" +
        "padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;";

    const title = document.createElement("div");
    title.style.cssText = "font-size:18px;font-weight:bold;margin-bottom:15px;text-align:center;";
    title.textContent = "💳 חובות";
    box.appendChild(title);

    const names = getDebtNames();

    if (names.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "color:#9ca3af;text-align:center;margin-bottom:15px;";

    } else {

function getAllBarNames() {
    const names = new Set(barNames);

    gameTables.forEach(function(table) {
        (table.table_players || []).forEach(function(player) {
            names.add(player.player_name);
        });
    });

    tabOrders.forEach(function(order) {
        if (!order.is_debt) names.add(order.tab_name);
    });

    return Array.from(names);
}

function buildItemsSummary(name) {
    const orders = getTabOrdersForName(name);
    if (orders.length === 0) return "";

    const grouped = new Map();
    orders.forEach(function(order) {
        const key = order.product_name;
        grouped.set(key, (grouped.get(key) || 0) + 1);
    });

    return Array.from(grouped.entries()).map(function(entry) {
        return entry[1] > 1 ? entry[0] + " ×" + entry[1] : entry[0];
    }).join(", ");
}

function renderBarNames() {
    barNamesList.innerHTML = "";

    const names = getAllBarNames();

    if (names.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "color:#9ca3af;";
        empty.textContent = "אין לקוחות כרגע";
        barNamesList.appendChild(empty);
        return;
    }

    names.forEach(function(name) {
        const container = document.createElement("div");
        container.style.cssText = "width:100%;";

        const wrapper = document.createElement("div");
        wrapper.style.cssText = "display:flex;align-items:center;gap:4px;width:100%;";

        const total = getTabTotal(name);

        const nameBtn = document.createElement("button");
        nameBtn.type = "button";
        nameBtn.style.cssText =
            "flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;" +
            "padding:12px 14px;background:#2563eb;color:white;font-weight:bold;";
        nameBtn.addEventListener("click", function() {
            openTabModal(name);
        });

        const nameSpan = document.createElement("span");
        nameSpan.textContent = "👤 " + name;
        nameBtn.appendChild(nameSpan);

        const itemsWrap = document.createElement("span");
        itemsWrap.style.cssText = "display:flex;align-items:center;justify-content:center;";

        const itemsSummary = buildItemsSummary(name);
        if (itemsSummary) {
            const itemsBadge = document.createElement("span");
            itemsBadge.style.cssText =
                "background:#f3f4f6;color:#111827;font-size:12px;font-weight:normal;" +
                "padding:3px 7px;border-radius:5px;";
            itemsBadge.textContent = itemsSummary;
            itemsWrap.appendChild(itemsBadge);
        }
        nameBtn.appendChild(itemsWrap);

        if (total > 0) {
            const totalSpan = document.createElement("span");
            totalSpan.textContent = total.toFixed(2) + " ₪";
            nameBtn.appendChild(totalSpan);
        }

        wrapper.appendChild(nameBtn);

        container.appendChild(wrapper);

        barNamesList.appendChild(container);
    });
}

addBarNameBtn.addEventListener("click", async function() {
    const name = prompt("שם הלקוח:");
    if (!name) return;

    const trimmed = name.trim();
    if (!trimmed) return;

    if (getAllBarNames().indexOf(trimmed) !== -1) return;

    const { error } = await db.from("bar_tabs").insert({ name: trimmed });

    if (error) {
        console.error("Add bar name error:", error);
        alert("שגיאה בהוספת השם: " + error.message);
        return;
    }

    barNames.unshift(trimmed);
    renderBarNames();
});

function openTabModal(name, options) {
    const defaultDebt = Boolean(options && options.defaultDebt);

    const overlay = document.createElement("div");
    overlay.style.cssText =
        "position:fixed;inset:0;background:rgba(0,0,0,.65);" +

        "background:#1f2937;border:1px solid #374151;border-radius:12px;" +

    const header = document.createElement("div");
    header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:8px;";
    box.appendChild(header);

    const title = document.createElement("div");
    title.style.cssText = "font-size:18px;font-weight:bold;";
    title.textContent = "👤 " + name;
    header.appendChild(title);

    const removeCustomerBtn = document.createElement("button");
    removeCustomerBtn.type = "button";
    removeCustomerBtn.textContent = "🗑 הסר לקוח";
    removeCustomerBtn.style.cssText =
        "padding:6px 10px;background:#7f1d1d;color:white;font-weight:bold;font-size:12px;white-space:nowrap;";
    removeCustomerBtn.addEventListener("click", async function() {
        if (getTabTotal(name) > 0) {
            alert("אי אפשר להסיר לקוח עם חוב פתוח");
            return;
        }

        const confirmed = await customConfirm("האם אתה בטוח שברצונך להסיר את הלקוח " + name + "?");
        if (!confirmed) return;

        removeCustomerBtn.disabled = true;
        const { error } = await db.from("bar_tabs").delete().eq("name", name);

        if (error) {
            console.error("Remove customer error:", error);
            alert("שגיאה בהסרת הלקוח: " + error.message);
            removeCustomerBtn.disabled = false;
            return;
        }

        barNames = barNames.filter(function(n) { return n !== name; });
        overlay.remove();
        renderBarNames();
    });
    header.appendChild(removeCustomerBtn);

    if (defaultDebt) {
        const debtModeHint = document.createElement("div");
        debtModeHint.style.cssText =
            "text-align:center;color:#f87171;font-size:13px;font-weight:bold;margin-bottom:12px;";
        debtModeHint.textContent = "🔴 פריטים חדשים יתווספו ישר כחוב";
        box.appendChild(debtModeHint);
    }

    const itemsList = document.createElement("div");
    itemsList.style.cssText = "margin-bottom:10px;";
    box.appendChild(itemsList);

    const totalLine = document.createElement("div");
    totalLine.style.cssText =
        "text-align:center;color:#4ade80;font-weight:bold;font-size:17px;margin-bottom:4px;";
    box.appendChild(totalLine);

    const debtLine = document.createElement("div");
    debtLine.style.cssText =
        "text-align:center;color:#f87171;font-weight:bold;font-size:14px;margin-bottom:18px;";
    box.appendChild(debtLine);

    const tabsRow = document.createElement("div");
    tabsRow.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:15px;";
    box.appendChild(tabsRow);

    const productsGrid = document.createElement("div");
    productsGrid.style.cssText = "display:flex;flex-direction:column;gap:8px;margin-bottom:20px;";
    box.appendChild(productsGrid);

    function renderItems() {
        itemsList.innerHTML = "";
        const orders = getTabOrdersForName(name);

        if (orders.length === 0) {
            const empty = document.createElement("div");
            empty.style.cssText = "color:#9ca3af;text-align:center;margin-bottom:10px;";
            empty.textContent = "אין הזמנות עדיין";
            itemsList.appendChild(empty);
        } else {
            orders.forEach(function(order) {
                const row = document.createElement("div");
                row.style.cssText =
                    "display:flex;justify-content:space-between;align-items:center;" +
                    "gap:10px;background:#111827;padding:8px 10px;border-radius:7px;margin-bottom:6px;" +
                    (order.is_debt ? "border:1px solid #dc2626;" : "");

                const text = document.createElement("span");
                text.textContent =
                    (order.is_debt ? "🔴 חוב — " : "") +
                    order.product_name + " — " + Number(order.price).toFixed(2) + " ₪";

                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.textContent = "מחק";
                removeBtn.style.cssText = "background:#7f1d1d;color:white;padding:6px 10px;";
                removeBtn.addEventListener("click", async function() {
                    if (order.is_debt) {
                        const confirmed = await customConfirm(
                            "הפריט הזה שמור כחוב. למחוק אותו לצמיתות?"
                        );
                        if (!confirmed) return;
                    }

                    removeBtn.disabled = true;
                    const { error } = await db
                        .from("tab_orders")
                        .delete()
                        .eq("id", order.id);

                    if (error) {
                        console.error("Remove tab order error:", error);
                        alert("שגיאה במחיקת ההזמנה: " + error.message);
                        removeBtn.disabled = false;
                        return;
                    }

                    tabOrders = tabOrders.filter(function(o) {
                        return o.id !== order.id;
                    });

                    renderItems();
                    renderBarNames();
                });

                row.appendChild(text);
                row.appendChild(removeBtn);
                itemsList.appendChild(row);
            });
        }

        totalLine.textContent = 'סה"כ: ' + getTabTotal(name).toFixed(2) + " ₪";

        const debtTotal = orders
            .filter(function(order) { return order.is_debt; })
            .reduce(function(sum, order) { return sum + Number(order.price || 0); }, 0);
        debtLine.textContent = debtTotal > 0 ? "מתוכם בחוב: " + debtTotal.toFixed(2) + " ₪" : "";
    }

    function renderProducts() {
        productsGrid.innerHTML = "";

        if (!activeCategory) return;

        const items = products.filter(function(product) {
            return product.category === activeCategory;
        });

        if (items.length === 0) {
            const empty = document.createElement("div");
            empty.style.cssText = "color:#9ca3af;text-align:center;";
            empty.textContent = "אין עדיין מוצרים בקטגוריה הזו";
            productsGrid.appendChild(empty);
        }

        items.forEach(function(product) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = product.name + " — " + Number(product.price).toFixed(2) + " ₪";
            btn.style.cssText = "padding:12px;background:#2563eb;color:white;font-weight:bold;";
            btn.addEventListener("click", async function() {
                btn.disabled = true;
                const { data, error } = await db
                    .from("tab_orders")
                    .insert({
                        tab_name: name,
                        category: activeCategory,
                        product_name: product.name,
                        price: Number(product.price),
                        is_debt: defaultDebt
                    })
                    .select()
                    .single();
                btn.disabled = false;

                if (error) {
                    console.error("Add tab order error:", error);
                    alert("שגיאה בהוספת ההזמנה: " + error.message);
                    return;
                }

                tabOrders.push(data);
                renderItems();
                renderBarNames();
            });
            productsGrid.appendChild(btn);
        });
    }

    function renderTabs() {
        tabsRow.innerHTML = "";
        PRODUCT_CATEGORIES.forEach(function(category) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = category.label;
            btn.style.cssText =
                "padding:10px 4px;font-size:13px;font-weight:bold;color:white;" +
                (category.key === activeCategory ? "background:#2563eb;" : "background:#374151;");
            btn.addEventListener("click", function() {
                activeCategory = (activeCategory === category.key) ? null : category.key;
                renderTabs();
                renderProducts();
            });
            tabsRow.appendChild(btn);
        });

        const fifaBtn = document.createElement("button");
        fifaBtn.type = "button";
        fifaBtn.textContent = "🎮 FIFA";
        fifaBtn.style.cssText =
            "padding:10px 4px;font-size:13px;font-weight:bold;color:white;background:#374151;";
        fifaBtn.addEventListener("click", async function() {
            fifaBtn.disabled = true;
            const { data, error } = await db
                .from("tab_orders")
                .insert({
                    tab_name: name,
                    category: "fifa",
                    product_name: "FIFA",
                    price: 20,
                    is_debt: defaultDebt
                })
                .select()
                .single();
            fifaBtn.disabled = false;

            if (error) {
                console.error("Add FIFA order error:", error);
                alert("שגיאה בהוספת FIFA: " + error.message);
                return;
            }

            tabOrders.push(data);
            renderItems();
            renderBarNames();
        });
        tabsRow.appendChild(fifaBtn);
    }

    const closeTabBtn = document.createElement("button");
    closeTabBtn.type = "button";
    closeTabBtn.textContent = "✓ סגור חשבון";
    closeTabBtn.style.cssText =
        "width:100%;padding:13px;margin-bottom:10px;" +
        "background:#f59e0b;color:#111827;font-weight:bold;font-size:16px;";
    closeTabBtn.addEventListener("click", async function() {
        const payableItems = getTabOrdersForName(name).filter(function(order) {
            return !order.is_debt;
        });
        const total = payableItems.reduce(function(sum, order) {
            return sum + Number(order.price || 0);
        }, 0);

        if (payableItems.length === 0) {
            const debtItems = getDebtOrdersForName(name);

            if (debtItems.length === 0) {
                alert("אין הזמנות לחשבון הזה");
                return;
            }

            const confirmed = await customConfirm(
                "כל הפריטים של " + name + " שמורים בחוב. לסגור את החשבון?"
            );
            if (!confirmed) return;

            const { error: barTabError } = await db
                .from("bar_tabs")
                .delete()
                .eq("name", name);

            if (barTabError) {
                console.error("Clear bar tab error:", barTabError);
            }

            barNames = barNames.filter(function(n) {
                return n !== name;
            });

            overlay.remove();
            renderBarNames();
            return;
        }

        const confirmed = await customConfirm(
            "לסגור את החשבון של " + name + " על סך " + total.toFixed(2) + " ₪?"
        );
        if (!confirmed) return;

        closeTabBtn.disabled = true;
        closeTabBtn.textContent = "סוגר חשבון...";

        const { data: insertedSale, error: saleError } = await db
            .from("sales")
            .insert({
                customer_name: name,
                hourly_price: 0,
                elapsed_seconds: 0,
                game_cost: 0,
                orders_cost: Number(total.toFixed(2)),
                total_amount: Number(total.toFixed(2)),
                closed_at: new Date().toISOString()
            })
            .select()
            .single();

        if (saleError) {
            console.error("Close tab error:", saleError);
            alert("שגיאה בשמירת החשבון: " + saleError.message);
            closeTabBtn.disabled = false;
            closeTabBtn.textContent = "✓ סגור חשבון";
            return;
        }

        const { error: itemsError } = await db
            .from("sale_items")
            .insert(
                payableItems.map(function(order) {
                    return {
                        sale_id: insertedSale.id,
                        category: order.category,
                        product_name: order.product_name,
                        price: Number(order.price || 0)
                    };
                })
            );
        if (itemsError) {
            console.error("Save sale items error:", itemsError);
        }

        const payableIds = payableItems.map(function(order) { return order.id; });
        const { error: deleteError } = await db
            .from("tab_orders")
            .delete()
            .in("id", payableIds);

        if (deleteError) {
            console.error("Clear tab orders error:", deleteError);
        }

        tabOrders = tabOrders.filter(function(order) {
            return payableIds.indexOf(order.id) === -1;
        });

        const { error: barTabError } = await db
            .from("bar_tabs")
            .delete()
            .eq("name", name);

        if (barTabError) {
            console.error("Clear bar tab error:", barTabError);
        }

        barNames = barNames.filter(function(n) {
            return n !== name;
        });

        overlay.remove();
        renderBarNames();
    });

    const debtBtn = document.createElement("button");
    debtBtn.type = "button";
    debtBtn.textContent = "חוב";
    debtBtn.style.cssText =
        "width:100%;padding:12px;margin-bottom:10px;" +
        "background:#dc2626;color:white;font-weight:bold;font-size:15px;";
    debtBtn.addEventListener("click", async function() {
        const currentOrders = getTabOrdersForName(name);

        if (currentOrders.length === 0) {
            alert("אין פריטים להזמנה הזו");
            return;
        }

        const result = await askDebtItems(currentOrders);
        if (!result) return;

        const toMarkDebt = result.filter(function(entry) {
            return entry.isDebt && !entry.order.is_debt;
        }).map(function(entry) { return entry.order.id; });

        const toUnmarkDebt = result.filter(function(entry) {
            return !entry.isDebt && entry.order.is_debt;
        }).map(function(entry) { return entry.order.id; });

        debtBtn.disabled = true;

        if (toMarkDebt.length > 0) {
            const { error } = await db
                .from("tab_orders")
                .update({ is_debt: true })
                .in("id", toMarkDebt);

            if (error) {
                console.error("Mark debt error:", error);
                alert("שגיאה בשמירת החוב: " + error.message);
                debtBtn.disabled = false;
                return;
            }
        }

        if (toUnmarkDebt.length > 0) {
            const { error } = await db
                .from("tab_orders")
                .update({ is_debt: false })
                .in("id", toUnmarkDebt);

            if (error) {
                console.error("Unmark debt error:", error);
                alert("שגיאה בהחזרת הפריט מהחוב: " + error.message);
                debtBtn.disabled = false;
                return;
            }
        }

        debtBtn.disabled = false;

        tabOrders.forEach(function(order) {
            if (toMarkDebt.indexOf(order.id) !== -1) order.is_debt = true;
            if (toUnmarkDebt.indexOf(order.id) !== -1) order.is_debt = false;
        });

        renderItems();
        renderBarNames();
    });

    const closeModalBtn = document.createElement("button");
    closeModalBtn.type = "button";
    closeModalBtn.textContent = "סגור חלון";
    closeModalBtn.style.cssText = "width:100%;padding:11px;background:#4b5563;color:white;";
    closeModalBtn.addEventListener("click", function() {
        overlay.remove();
    });

    box.appendChild(closeTabBtn);
    box.appendChild(debtBtn);
    box.appendChild(closeModalBtn);

    overlay.appendChild(box);
    overlay.addEventListener("click", function(event) {
        if (event.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);

    renderTabs();
    renderProducts();
    renderItems();
}

function formatTime(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours).padStart(2, "0")
        + ":" +

        String(minutes).padStart(2, "0")
        + ":" +

        String(seconds).padStart(2, "0")

    );
}

function formatTimeHM(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    return String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0");
}

function buildSalesReportRows(salesData) {
    const allRows = [];

    salesData.forEach(function(sale) {
        const saleDate = new Date(sale.closed_at || sale.created_at);
        const dateText =
            saleDate.toLocaleDateString("he-IL") + " " +
            saleDate.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });

        const itemsGrouped = new Map();
        (sale.sale_items || []).forEach(function(item) {
            const key = item.product_name;
            if (!itemsGrouped.has(key)) {
                itemsGrouped.set(key, { name: item.product_name, qty: 0, total: 0 });
            }
            const entry = itemsGrouped.get(key);
            entry.qty += 1;
            entry.total += Number(item.price || 0);
        });

        const itemRows = Array.from(itemsGrouped.values()).map(function(entry) {
            return { item: entry.name, qty: entry.qty, price: entry.total };
        });

        if (Number(sale.game_cost || 0) > 0) {
            itemRows.push({
                item: "⏱ זמן משחק (" + formatTime(Number(sale.elapsed_seconds || 0)) + ")",
                qty: "-",
                price: Number(sale.game_cost)
            });
        }

        if (itemRows.length === 0) {
            itemRows.push({ item: "-", qty: "-", price: Number(sale.total_amount || 0) });
        }

        itemRows.forEach(function(row, index) {
            allRows.push({
                date: index === 0 ? dateText : "",
                name: index === 0 ? (sale.customer_name || "ללא שם") : "",
                item: row.item,
                qty: row.qty,
                price: Number(row.price).toFixed(2)
            });
        });

        allRows.push({
            date: "",
            name: "",
            item: 'סה"כ',
            qty: "",
            price: Number(sale.total_amount || 0).toFixed(2),
            isTotal: true
        });
    });

    return allRows;
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function printSalesReport(salesData, totalIncomeValue) {
    const printWindow = window.open("", "_blank");

        alert("הדפדפן חסם את פתיחת חלון ההדפסה. אשר חלונות קופצים ונסה שוב.");

        "<style>" +
        "body{font-family:Arial,sans-serif;color:#111827;padding:24px;}" +

function getElapsedSeconds(customer) {

    let seconds =
        Number(
            customer.elapsedSeconds
        ) || 0;


    if (
        customer.running &&
        customer.startedAt
    ) {

        seconds +=
            Math.floor(
                (
                    Date.now() -
                    customer.startedAt
                ) / 1000
            );

    }


    return Math.max(
        0,
        seconds
    );
}


function getGameCost(customer) {

    const rawCost = (

        getElapsedSeconds(customer)
        / 3600

    ) * Number(
        customer.hourlyPrice || 0
    );

    return Math.floor(rawCost);
}

            "שגיאה בטעינת היסטוריית המכירות"
        );

        salesHistoryBtn.textContent =
            "📊 היסטוריית מכירות";

        return;
    }


    salesHistory.innerHTML = "";


    // אין מכירות
    if (!data || data.length === 0) {

        salesHistory.innerHTML = `
            <div style="
                background:#1f2937;
                border:1px solid #374151;
                border-radius:10px;
                padding:20px;
                text-align:center;
                color:#9ca3af;
            ">
                אין מכירות עדיין
            </div>
        `;

        salesHistory.style.display =
            "block";

        salesHistoryBtn.textContent =
            "✖ סגור היסטוריה";

        return;
    }


    /* =========================
       TOTAL SALES
    ========================= */

    const totalIncome =
        data.reduce(
            function(total, sale) {

                return total +
                    Number(
                        sale.total_amount || 0
                    );

            },
            0
        );


    const totalBox =
        document.createElement("div");


    totalBox.style.cssText = `
        background:#18212f;
        border:1px solid #374151;
        border-radius:10px;
        padding:18px;
        margin-bottom:20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:18px;
        font-weight:bold;
    `;


    const totalLabel =
        document.createElement("span");

    totalLabel.textContent =
        "סה״כ מכירות";


    const totalValue =
        document.createElement("span");

    totalValue.style.color =
        "#4ade80";

    const revealTotalBtn = document.createElement("button");
    revealTotalBtn.type = "button";
    revealTotalBtn.textContent = "🔒 הצג";
    revealTotalBtn.style.cssText =
        "padding:8px 14px;background:#4b5563;color:white;font-weight:bold;font-size:14px;";
    revealTotalBtn.addEventListener("click", async function() {
        const pinCorrect = await askSalesHistoryPin();
        if (!pinCorrect) return;
        totalValue.textContent = totalIncome.toFixed(2) + " ₪";
    });
    totalValue.appendChild(revealTotalBtn);


    totalBox.appendChild(
        totalLabel
    );

    totalBox.appendChild(
        totalValue
    );


    salesHistory.appendChild(
        totalBox
    );


    /* =========================
       EXPORT ACTIONS
    ========================= */

    const exportRow = document.createElement("div");
    exportRow.style.cssText = "display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;";

    const pdfBtn = document.createElement("button");
    pdfBtn.type = "button";
    pdfBtn.textContent = "📄 שמור / הדפס PDF";
    pdfBtn.style.cssText =
        "padding:13px 6px;background:#dc2626;color:white;font-weight:bold;font-size:14px;";
    pdfBtn.addEventListener("click", function() {
        printSalesReport(data, totalIncome);
    });

    const deleteHistoryBtn = document.createElement("button");
    deleteHistoryBtn.type = "button";
    deleteHistoryBtn.textContent = "🗑 מחק היסטוריה";
    deleteHistoryBtn.style.cssText =
        "padding:13px 6px;background:#7f1d1d;color:white;font-weight:bold;font-size:14px;";
    deleteHistoryBtn.addEventListener("click", async function() {
        const pinCorrect = await askSalesHistoryPin();
        if (!pinCorrect) return;

        const confirmed = await customConfirm(
            "⚠️ פעולה זו תמחק את כל היסטוריית המכירות לצמיתות ולא ניתן לבטל אותה.\n\nלהמשיך?"
        );
        if (!confirmed) return;

        deleteHistoryBtn.disabled = true;
        deleteHistoryBtn.textContent = "מוחק...";

        const { error } = await db.from("sales").delete().gt("id", 0);

        if (error) {
            console.error("Delete sales history error:", error);
            alert("שגיאה במחיקת ההיסטוריה: " + error.message);
            deleteHistoryBtn.disabled = false;
            deleteHistoryBtn.textContent = "🗑 מחק היסטוריה";
            return;
        }

        salesHistory.style.display = "none";
        await loadSalesHistory();
    });

    exportRow.appendChild(pdfBtn);
    exportRow.appendChild(deleteHistoryBtn);
    salesHistory.appendChild(exportRow);


    /* =========================
       SALES TABLE
    ========================= */

    const salesTableWrapper = document.createElement("div");
    salesTableWrapper.style.cssText = "overflow-x:auto;";

    const gridBorder = "1px solid #ffffff";

    data.forEach(function(sale, groupIndex) {

        const saleTable = document.createElement("table");
        saleTable.style.cssText = "width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px;border:" + gridBorder + ";";

        const saleThead = document.createElement("thead");
        saleThead.innerHTML = `
            <tr style="background:#18212f;">
                <th style="padding:10px 6px;text-align:right;border:${gridBorder};">שם</th>
                <th style="padding:10px 6px;text-align:right;border:${gridBorder};">פריט</th>
                <th style="padding:10px 6px;text-align:center;border:${gridBorder};">כמות</th>
                <th style="padding:10px 6px;text-align:right;border:${gridBorder};">מחיר</th>
                <th style="padding:10px 6px;text-align:right;border:${gridBorder};white-space:nowrap;">תאריך</th>
            </tr>
        `;
        saleTable.appendChild(saleThead);

        const saleTbody = document.createElement("tbody");

        const saleDate = new Date(sale.closed_at || sale.created_at);
        const dateText =
            saleDate.toLocaleDateString("he-IL") + " " +
            saleDate.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });

        const itemsGrouped = new Map();
        (sale.sale_items || []).forEach(function(item) {
            const key = item.product_name;
            if (!itemsGrouped.has(key)) {
                itemsGrouped.set(key, { name: item.product_name, qty: 0, total: 0 });
            }
            const entry = itemsGrouped.get(key);
            entry.qty += 1;
            entry.total += Number(item.price || 0);
        });

        const rows = Array.from(itemsGrouped.values()).map(function(entry) {
            return { item: entry.name, qty: entry.qty, price: entry.total };
        });

        if (Number(sale.game_cost || 0) > 0) {
            rows.push({
                item: "⏱ זמן משחק (" + formatTime(Number(sale.elapsed_seconds || 0)) + ")",
                qty: "-",
                price: Number(sale.game_cost)
            });
        }

        if (rows.length === 0) {
            rows.push({ item: "-", qty: "-", price: Number(sale.total_amount || 0) });
        }

        rows.forEach(function(row, index) {
            const tr = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.style.cssText = "padding:7px 6px;font-weight:bold;border:" + gridBorder + ";";
            nameCell.textContent = index === 0 ? (sale.customer_name || "ללא שם") : "";

            const itemCell = document.createElement("td");
            itemCell.style.cssText = "padding:7px 6px;border:" + gridBorder + ";";
            itemCell.textContent = row.item;

            const qtyCell = document.createElement("td");
            qtyCell.style.cssText = "padding:7px 6px;text-align:center;color:#9ca3af;border:" + gridBorder + ";";
            qtyCell.textContent = row.qty;

            const priceCell = document.createElement("td");
            priceCell.style.cssText = "padding:7px 6px;text-align:right;white-space:nowrap;border:" + gridBorder + ";";
            priceCell.textContent = Number(row.price).toFixed(2) + " ₪";

            const dateCell = document.createElement("td");
            dateCell.style.cssText = "padding:7px 6px;color:#9ca3af;font-size:12px;white-space:nowrap;border:" + gridBorder + ";";
            dateCell.textContent = index === 0 ? dateText : "";

            tr.appendChild(nameCell);
            tr.appendChild(itemCell);
            tr.appendChild(qtyCell);
            tr.appendChild(priceCell);
            tr.appendChild(dateCell);
            saleTbody.appendChild(tr);
        });

        const totalTr = document.createElement("tr");
        totalTr.innerHTML =
            '<td colspan="3" style="padding:7px 6px;text-align:right;font-weight:bold;color:#4ade80;border:' + gridBorder + ';">סה"כ</td>' +
            '<td style="padding:7px 6px;text-align:right;font-weight:bold;color:#4ade80;white-space:nowrap;border:' + gridBorder + ';">' +
            Number(sale.total_amount || 0).toFixed(2) + ' ₪</td>' +
            '<td style="border:' + gridBorder + ';"></td>';
        saleTbody.appendChild(totalTr);

        saleTable.appendChild(saleTbody);
        salesTableWrapper.appendChild(saleTable);
    });

    salesHistory.appendChild(salesTableWrapper);


    salesHistory.style.display =
        "block";


    salesHistoryBtn.textContent =
        "✖ סגור היסטוריה";
}
/* =========================
   LOGOUT
========================= */

async function handleLogout() {

    const confirmed =
        await customConfirm("האם אתה בטוח שברצונך להתנתק?");

    if (!confirmed) {
        return;
    }


    const { error } =
        await db.auth.signOut();


    if (error) {

        console.error(
            "Logout error:",
            error
        );

        alert(
            "שגיאה בהתנתקות"
        );

        return;
    }


    gameTables = [];
    gameTableDisplays.clear();
    gameTablesList.innerHTML = "";

    products = [];
    tabOrders = [];
    barNames = [];
    barNamesList.innerHTML = "";

    salesHistory.innerHTML = "";

    salesHistory.style.display =
        "none";


    adminPassword.value = "";

    loginError.style.display =
        "none";


    app.style.display =
        "none";

    loginScreen.style.display =
        "flex";
}
</script>
</body>
</html>
